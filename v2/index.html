<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121c14" id="meta-theme">
    <title>Breathing is Beautiful</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* ─── Reset & Base ────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-dark: #0e1710;
            --bg-mid:  #121c14;
            --text-primary: #dce8df;
            --text-muted: #7a9882;
            --glass-bg: rgba(255,255,255,0.03);
            --glass-border: rgba(255,255,255,0.08);

            /* Phase colour tokens — updated by JS */
            --phase-hue: 150;
            --phase-sat: 40%;
            --phase-light: 55%;
            --phase-color: hsl(var(--phase-hue), var(--phase-sat), var(--phase-light));
            --phase-glow:  hsla(var(--phase-hue), var(--phase-sat), var(--phase-light), 0.35);

            --circle-scale: 1;
            --ring-progress: 0; /* 0→1 fraction of arc remaining */
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-primary);
            font-family: 'DM Sans', system-ui, sans-serif;
            background: radial-gradient(ellipse at 50% 40%, #1b2e1e 0%, var(--bg-dark) 70%);
            overflow-y: auto;
            overscroll-behavior-y: none;
            position: relative;
        }

        /* ─── Background radial glow ──────────────────────────────────── */
        #bg-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(
                ellipse 60% 50% at 50% 55%,
                var(--phase-glow) 0%,
                transparent 70%
            );
            transition: background 1.5s ease;
            opacity: 0;
            transition: opacity 1.2s ease, background 1.8s ease;
        }
        body.session-active #bg-glow {
            opacity: 1;
        }

        /* ─── Layout wrapper ─────────────────────────────────────────── */
        #app {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 460px;
            padding: 16px 16px 24px;
            gap: 0;
            position: relative;
            z-index: 1;
        }

        /* ─── Glass control panel ────────────────────────────────────── */
        #control-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 18px 20px;
            width: 100%;
            margin-bottom: 20px;
        }

        /* Header row: title + toggle */
        #panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
        }

        #panel-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.1rem;
            color: var(--text-primary);
            opacity: 0.9;
            letter-spacing: 0.3px;
        }

        /* Collapsed state: only show mini-open button */
        #mini-reveal-btn {
            display: none;
            background: transparent;
            border: 1px solid rgba(139,169,151,0.25);
            color: var(--text-muted);
            font-size: 0.78rem;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: opacity 0.2s, border-color 0.2s;
            white-space: nowrap;
        }
        #mini-reveal-btn:hover { border-color: rgba(139,169,151,0.55); }

        body.session-active #panel-header { display: none; }
        body.session-active #mini-reveal-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 0;
        }

        /* ─── Session quick controls (pause visible mid-session) ─────── */
        #session-quick-controls {
            display: none;
            gap: 8px;
            width: 100%;
            margin-bottom: 4px;
        }
        body.session-active #session-quick-controls {
            display: flex;
            align-items: center;
        }
        #session-top-row {
            display: none;
            gap: 8px;
            width: 100%;
            margin-bottom: 4px;
            align-items: center;
        }
        body.session-active #session-top-row {
            display: flex;
        }
        #quick-pause-btn {
            flex: 1;
            background: rgba(255,255,255,0.08);
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.12);
            font-size: 0.85rem;
            padding: 7px 14px;
            border-radius: 20px;
            font-weight: 400;
        }
        #quick-pause-btn.is-paused {
            background: rgba(74,122,90,0.25);
            color: var(--text-primary);
            border-color: rgba(74,122,90,0.4);
        }

        /* The collapsible settings body */
        #settings-body {
            overflow: hidden;
            max-height: 600px;
            transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.35s ease,
                        margin-top 0.35s ease;
            margin-top: 16px;
            opacity: 1;
        }
        #settings-body.collapsed {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }

        .settings-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            margin-bottom: 16px;
        }
        .settings-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
        }

        /* Pattern select with description */
        #pattern-wrap { width: 100%; }
        #pattern-select {
            width: 100%;
        }
        #pattern-description {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 6px;
            min-height: 1.1em;
            font-style: italic;
            letter-spacing: 0.2px;
        }

        /* Styled form controls */
        select, input[type="number"] {
            background: rgba(0,0,0,0.25);
            color: var(--text-primary);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            flex-grow: 1;
            transition: border-color 0.2s;
        }
        select:focus, input[type="number"]:focus {
            border-color: rgba(123,169,139,0.45);
        }
        input[type="number"] {
            width: 64px;
            text-align: center;
            flex-grow: 0;
        }
        select option { background: #1a2e1e; }

        .custom-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
        }
        .custom-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 0.72rem;
            color: var(--text-muted);
        }
        .custom-cell input {
            width: 100% !important;
            padding: 7px 4px !important;
            text-align: center;
        }
        #custom-row { display: none; }

        .mixer-row {
            display: flex;
            gap: 16px;
            width: 100%;
        }
        .mixer-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            font-size: 0.8rem;
            color: var(--text-muted);
            flex: 1;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #7ba98b;
            cursor: pointer;
        }

        /* ─── Haptic toggle switch ───────────────────────────────────── */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .toggle-label {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 42px;
            height: 24px;
            flex-shrink: 0;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: rgba(255,255,255,0.1);
            border-radius: 24px;
            transition: background 0.25s;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            left: 2px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--text-muted);
            border-radius: 50%;
            transition: transform 0.25s, background 0.25s;
        }
        .toggle-switch input:checked + .toggle-slider {
            background: rgba(74,122,90,0.55);
            border-color: rgba(74,122,90,0.4);
        }
        .toggle-switch input:checked + .toggle-slider::before {
            transform: translate(18px, -50%);
            background: #7ba98b;
        }

        /* ─── Action buttons ─────────────────────────────────────────── */
        .btn-row {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            margin-top: 18px;
        }
        button {
            padding: 10px 22px;
            font-size: 0.95rem;
            font-family: 'DM Sans', sans-serif;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: transform 0.1s, opacity 0.2s, background 0.2s;
            background: #4a7a5a;
            color: #e8f5ed;
        }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        #pause-btn { background: rgba(255,255,255,0.08); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.12); }
        #reset-btn  { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); }

        /* ─── Timer & stats ──────────────────────────────────────────── */
        #timer-display {
            font-size: 2.6rem;
            font-weight: 300;
            letter-spacing: 3px;
            margin-top: 6px;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
            font-family: 'DM Serif Display', serif;
        }
        #stats-display {
            font-size: 0.78rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* ─── Instruction label ──────────────────────────────────────── */
        #instruction {
            font-family: 'DM Serif Display', serif;
            font-size: 1.7rem;
            font-weight: 400;
            margin: 20px 0 8px;
            min-height: 2.2rem;
            letter-spacing: 0.5px;
            text-align: center;
            color: var(--phase-color);
            transition: color 1.2s ease;
        }

        /* Phase countdown inside the ring */
        #phase-countdown {
            font-size: 1.1rem;
            font-weight: 300;
            color: var(--text-muted);
            margin-bottom: 16px;
            letter-spacing: 1px;
            min-height: 1.5rem;
            text-align: center;
            font-variant-numeric: tabular-nums;
            transition: opacity 0.4s;
        }

        /* ─── Breathing circle + SVG arc ring ────────────────────────── */
        .pacer-container {
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            margin-bottom: 10px;
        }

        /* SVG arc sits behind the circle */
        #arc-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform: rotate(-90deg);
            pointer-events: none;
        }

        #arc-track {
            fill: none;
            stroke: rgba(255,255,255,0.06);
            stroke-width: 4;
        }

        #arc-progress {
            fill: none;
            stroke: var(--phase-color);
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke 1.2s ease;
            /* stroke-dasharray set by JS */
        }

        .circle {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            will-change: transform;
            background: radial-gradient(circle at 38% 36%,
                hsl(var(--phase-hue), calc(var(--phase-sat) + 10%), calc(var(--phase-light) + 12%)),
                hsl(var(--phase-hue), var(--phase-sat), calc(var(--phase-light) - 18%))
            );
            box-shadow:
                0 0 40px var(--phase-glow),
                0 0 80px hsla(var(--phase-hue), var(--phase-sat), var(--phase-light), 0.12),
                inset 0 0 24px rgba(255,255,255,0.15);
            transform: scale(var(--circle-scale));
            transition:
                background 1.2s ease,
                box-shadow 1.2s ease,
                transform 0.05s linear;
        }

        /* Hold-phase pulsing ring animation */
        @keyframes holdPulse {
            0%, 100% { box-shadow: 0 0 40px var(--phase-glow), 0 0 80px hsla(var(--phase-hue), var(--phase-sat), var(--phase-light), 0.12), inset 0 0 24px rgba(255,255,255,0.15); }
            50%        { box-shadow: 0 0 65px var(--phase-glow), 0 0 110px hsla(var(--phase-hue), var(--phase-sat), var(--phase-light), 0.22), inset 0 0 28px rgba(255,255,255,0.22); }
        }
        .circle.hold-pulse {
            animation: holdPulse 2s ease-in-out infinite;
        }

        /* ─── Session Complete overlay ──────────────────────────────── */
        #complete-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            background: rgba(10, 20, 12, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            text-align: center;
            padding: 40px 24px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        #complete-overlay.visible {
            display: flex;
        }
        #complete-overlay.shown {
            opacity: 1;
        }

        #complete-title {
            font-family: 'DM Serif Display', serif;
            font-size: 2.2rem;
            color: var(--text-primary);
            line-height: 1.2;
        }
        #complete-subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            max-width: 280px;
            line-height: 1.6;
        }
        #complete-stats {
            font-size: 0.9rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 14px 28px;
            letter-spacing: 0.5px;
            line-height: 1.8;
        }
        #complete-btn {
            margin-top: 8px;
            padding: 13px 36px;
            font-size: 1rem;
            border-radius: 50px;
            background: #4a7a5a;
        }

        /* ─── Sheet drag handle (hidden on desktop) ─────────────────── */
        #sheet-handle {
            display: none;
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.22);
            border-radius: 2px;
            margin: 0 auto 10px;
            flex-shrink: 0;
        }

        /* ─── Audio tip banner (mobile only) ────────────────────────── */
        #audio-tip {
            display: none;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            padding: 8px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            line-height: 1.4;
        }

        /* ─── Safe-area top: nothing clips under Android status bar ─── */
        body {
            padding-top: env(safe-area-inset-top, 0px);
        }

        /* ─── Mobile bottom-sheet layout ─────────────────────────────── */
        @media (max-width: 640px) {
            #sheet-handle { display: block; }
            #audio-tip    { display: block; }

            /* Lift panel out of normal flow so it can't push the circle off-screen */
            #control-panel {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                max-width: 100%;
                border-radius: 20px 20px 0 0;
                margin-bottom: 0;
                padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
                z-index: 50;
            }

            /* Give the circle area clearance above the fixed panel */
            #app {
                max-width: 100%;
                min-height: 100vh;
                padding-bottom: 180px;
                justify-content: center;
            }

            /* Settings body scrolls internally, never grows the viewport */
            #settings-body {
                max-height: 55vh;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
        }
    </style>
</head>
<body>

<div id="bg-glow"></div>

<!-- Session complete overlay -->
<div id="complete-overlay" role="dialog" aria-modal="true" aria-labelledby="complete-title">
    <div id="complete-title">Well done.</div>
    <div id="complete-subtitle">Take a moment to feel the stillness you've created.</div>
    <div id="complete-stats"></div>
    <button id="complete-btn">Begin Again</button>
</div>

<div id="app">

    <!-- Control panel / mobile bottom sheet -->
    <div id="control-panel">
        <div id="sheet-handle" aria-hidden="true"></div>
        <div id="panel-header">
            <span id="panel-title">🌿 Breathing is Beautiful</span>
            <button id="toggle-settings-btn" style="background:transparent;border:1px solid rgba(139,169,151,0.25);color:var(--text-muted);font-size:0.8rem;padding:5px 14px;border-radius:20px;font-weight:400;">Settings ↕</button>
        </div>

        <!-- Mid-session top row: settings reveal + pause -->
        <div id="session-top-row">
            <button id="mini-reveal-btn">⚙ Settings</button>
            <button id="quick-pause-btn">⏸ Pause</button>
        </div>

        <div id="settings-body">
            <div class="settings-section">
                <!-- Pattern selector -->
                <div id="pattern-wrap">
                    <select id="pattern-select">
                        <option value="4-6">Relax (4:6)</option>
                        <option value="5-5">Coherent (5:5)</option>
                        <option value="box">Box (4-4-4-4)</option>
                        <option value="4-7-8">Deep Rest (4-7-8)</option>
                        <option value="4-2-4-2">Balanced (4-2-4-2)</option>
                        <option value="custom">Custom Setup…</option>
                    </select>
                    <div id="pattern-description"></div>
                </div>

                <!-- Custom pattern inputs -->
                <div class="custom-grid" id="custom-row">
                    <div class="custom-cell">
                        <label>Inhale</label>
                        <input type="number" id="c-in"  value="4" min="1" max="20">
                    </div>
                    <div class="custom-cell">
                        <label>Hold</label>
                        <input type="number" id="c-h1" value="2" min="0" max="20">
                    </div>
                    <div class="custom-cell">
                        <label>Exhale</label>
                        <input type="number" id="c-out" value="6" min="1" max="20">
                    </div>
                    <div class="custom-cell">
                        <label>Hold</label>
                        <input type="number" id="c-h2" value="0" min="0" max="20">
                    </div>
                </div>

                <!-- Session length -->
                <div class="row">
                    <label style="color:var(--text-muted);font-size:0.85rem;white-space:nowrap;">Session length:</label>
                    <input type="number" id="minutes-input" value="16" min="1" max="60">
                    <span style="color:var(--text-muted);font-size:0.85rem;">min</span>
                </div>
            </div>

            <div class="settings-section">
                <div class="row">
                    <select id="sound-select">
                        <option value="chords">Resolving Chords</option>
                        <option value="warm">Warm Synth</option>
                        <option value="ocean">Ocean Waves</option>
                        <option value="sine">Basic Sine</option>
                        <option value="mute">Mute</option>
                    </select>
                    <select id="ambient-select">
                        <option value="none">No Background</option>
                        <option value="rain">Soft Rain</option>
                        <option value="wind">Gentle Wind</option>
                        <option value="stream">Forest Stream</option>
                    </select>
                </div>
                <div class="mixer-row">
                    <div class="mixer-col">
                        <label>Breathing Vol</label>
                        <input type="range" id="pacer-vol-slider" min="0" max="1" step="0.01" value="1">
                    </div>
                    <div class="mixer-col">
                        <label>Nature Vol</label>
                        <input type="range" id="ambient-vol-slider" min="0" max="1" step="0.01" value="0.35">
                    </div>
                </div>

                <!-- Haptic feedback toggle -->
                <div class="toggle-row">
                    <span class="toggle-label">Haptic feedback</span>
                    <label class="toggle-switch" aria-label="Toggle haptic feedback">
                        <input type="checkbox" id="haptic-toggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>

            <div class="btn-row">
                <button id="start-btn">Start</button>
                <button id="pause-btn" disabled>Pause</button>
                <button id="reset-btn">Reset</button>
            </div>

            <div id="audio-tip">💡 Keep screen on during sessions for continuous audio</div>
        </div>

        <div id="timer-display">16:00</div>
        <div id="stats-display">Streak: 0 Days · Total: 0 Mins</div>
    </div><!-- /control-panel -->

    <!-- Instruction text (aria-live for screen readers) -->
    <div id="instruction" aria-live="polite" aria-atomic="true">Ready to breathe</div>
    <div id="phase-countdown"></div>

    <!-- Breathing circle -->
    <div class="pacer-container">
        <svg id="arc-svg" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
            <circle id="arc-track"    cx="130" cy="130" r="122"/>
            <circle id="arc-progress" cx="130" cy="130" r="122"/>
        </svg>
        <div class="circle" id="circle"></div>
    </div>

</div><!-- /app -->

<script>
/* ═══════════════════════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════════════════════ */
const CIRCLE_MIN_SCALE    = 1.0;
const CIRCLE_MAX_SCALE    = 2.5;
const CIRCLE_HOLD_IN_SCALE  = 2.5;   // scale after inhale hold
const CIRCLE_HOLD_OUT_SCALE = 1.0;   // scale after exhale hold
const EASE_POWER          = 2;
const ARC_RADIUS          = 122;
const ARC_CIRCUMFERENCE   = 2 * Math.PI * ARC_RADIUS;
const HAPTIC_MS           = 50;
const COMPLETION_HOLD_SEC = 3;       // stillness before overlay
const STATS_KEY           = 'breathBeautifulStats_v2';

═══════════════════════════════════════════════════════════════ */
function setPhaseColor(type) {
    const c = PHASE_COLORS[type] || PHASE_COLORS.exhale;
    const root = document.documentElement;
    root.style.setProperty('--phase-hue',   c.hue);
    root.style.setProperty('--phase-sat',   c.sat);
    root.style.setProperty('--phase-light', c.light);
    root.style.setProperty('--phase-color', `hsl(${c.hue}, ${c.sat}, ${c.light})`);
    root.style.setProperty('--phase-glow',  `hsla(${c.hue}, ${c.sat}, ${c.light}, 0.35)`);
}

   WAKE LOCK
═══════════════════════════════════════════════════════════════ */
async function requestWakeLock() {
    try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) { console.log('Wake lock:', e); }
}
function releaseWakeLock() {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
}

/* ═══════════════════════════════════════════════════════════════
   STATS (localStorage)
═══════════════════════════════════════════════════════════════ */
let currentStats = { totalSeconds: 0, streak: 0, lastDate: '' };

function loadStats() {
    try {
        const saved = localStorage.getItem(STATS_KEY);
        if (saved) currentStats = JSON.parse(saved);
    } catch (e) { /* storage blocked */ }
    renderStats();
}

function renderStats() {
    const mins = Math.floor((currentStats.totalSeconds || 0) / 60);
    statsDisplay.textContent = `Streak: ${currentStats.streak || 0} Days · Total: ${mins} Mins`;
}

function saveSessionStats(secondsCompleted) {
    if (secondsCompleted <= 0) return;
    const today = new Date().toDateString();
    if (currentStats.lastDate !== today) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        currentStats.streak = currentStats.lastDate === yesterday.toDateString()
            ? currentStats.streak + 1
            : 1;
        currentStats.lastDate = today;
    }
    currentStats.totalSeconds += secondsCompleted;
    try { localStorage.setItem(STATS_KEY, JSON.stringify(currentStats)); } catch (e) {}
    renderStats();
}

function flushStats() {
    if (sessionState.pendingSeconds > 0) {
        saveSessionStats(sessionState.pendingSeconds);
        sessionState.pendingSeconds = 0;
    }
}

/* ═══════════════════════════════════════════════════════════════
   AUDIO — keep-alive for Android lock screen
═══════════════════════════════════════════════════════════════ */
function startKeepAlive() {
    if (keepAliveOsc || !audioCtx) return;
    keepAliveOsc  = audioCtx.createOscillator();
    keepAliveGain = audioCtx.createGain();
    keepAliveGain.gain.value = 0.0001; // essentially silent but keeps context alive
    keepAliveOsc.frequency.value = 1;  // 1 Hz, completely inaudible
    keepAliveOsc.connect(keepAliveGain);
    keepAliveGain.connect(audioCtx.destination);
    keepAliveOsc.start();
}

function stopKeepAlive() {
    if (keepAliveOsc) {
        try { keepAliveOsc.stop(); } catch(e) {}
        keepAliveOsc.disconnect();
        keepAliveOsc  = null;
        keepAliveGain = null;
    }
}

function setupMediaSession() {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
        title: 'Breathing is Beautiful',
        artist: 'Breathing Session',
        album: 'Zen Pacer',
    });
    navigator.mediaSession.setActionHandler('play',  () => { startSession(); updateQuickPauseBtn(); });
    navigator.mediaSession.setActionHandler('pause', () => { pauseSession(); updateQuickPauseBtn(); });
    navigator.mediaSession.playbackState = 'playing';
}

function updateMediaSession(state) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.playbackState = state; // 'playing' | 'paused'
}

/* ═══════════════════════════════════════════════════════════════
   AUDIO
═══════════════════════════════════════════════════════════════ */
function initAudio() {
    if (!audioCtx) {
        audioCtx       = new (window.AudioContext || window.webkitAudioContext)();
        pacerSwellGain = audioCtx.createGain();
        pacerVolGain   = audioCtx.createGain();
        ambientVolGain = audioCtx.createGain();
        pacerVolGain.gain.value   = parseFloat(pacerVolSlider.value);
        ambientVolGain.gain.value = parseFloat(ambientVolSlider.value);
        pacerSwellGain.connect(pacerVolGain);
        pacerVolGain.connect(audioCtx.destination);
        ambientVolGain.connect(audioCtx.destination);
    }
    // Android Chrome suspends the context on screen-lock; always attempt resume
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}

function playAmbient() {
    [ambientNode, ambientFilter, windLfo, windLfoGain].forEach(n => {
        if (n) { try { n.stop(); } catch(e){} n.disconnect(); }
    });
    ambientNode = ambientFilter = windLfo = windLfoGain = null;

    const type = ambientSelect.value;
    if (type === 'none') return;
    initAudio();

    const bufSize = audioCtx.sampleRate * 2;
    const buf     = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data    = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < bufSize; i++) {
        const white = Math.random() * 2 - 1;
        data[i] = (last + 0.02 * white) / 1.02;
        last = data[i];
        data[i] *= 3.5;
    }
    ambientNode = audioCtx.createBufferSource();
    ambientNode.buffer = buf;
    ambientNode.loop = true;
    ambientFilter = audioCtx.createBiquadFilter();

    if (type === 'rain') {
        ambientFilter.type = 'lowpass'; ambientFilter.frequency.value = 800; ambientFilter.Q.value = 0.5;
    } else if (type === 'stream') {
        ambientFilter.type = 'lowpass'; ambientFilter.frequency.value = 350; ambientFilter.Q.value = 0.5;
    } else if (type === 'wind') {
        ambientFilter.type = 'bandpass'; ambientFilter.frequency.value = 250; ambientFilter.Q.value = 0.5;
        windLfo = audioCtx.createOscillator();
        windLfo.type = 'sine'; windLfo.frequency.value = 0.05;
        windLfoGain = audioCtx.createGain(); windLfoGain.gain.value = 150;
        windLfo.connect(windLfoGain); windLfoGain.connect(ambientFilter.frequency);
        windLfo.start();
    }
    ambientNode.connect(ambientFilter);
    ambientFilter.connect(ambientVolGain);
    ambientNode.start();
}

ambientSelect.addEventListener('change', () => { initAudio(); playAmbient(); });
pacerVolSlider.addEventListener('input',  e => { if (pacerVolGain)  pacerVolGain.gain.setTargetAtTime(e.target.value,  audioCtx.currentTime, 0.1); });
ambientVolSlider.addEventListener('input',e => { if (ambientVolGain) ambientVolGain.gain.setTargetAtTime(e.target.value, audioCtx.currentTime, 0.1); });

function triggerAudio(phaseType, duration, baseFreq) {
    const choice = soundSelect.value;
    if (choice === 'mute' || !audioCtx || !pacerSwellGain) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    const gap = 0.15;

    if (choice === 'sine') {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine'; osc.frequency.value = baseFreq;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.5, now + 1);
        gain.gain.setValueAtTime(0.5, now + duration - 1);
        gain.gain.linearRampToValueAtTime(0.001, now + duration - gap);
        osc.connect(gain); gain.connect(pacerSwellGain);
        osc.start(now); osc.stop(now + duration - gap);

    } else if (choice === 'warm') {
        const osc1 = audioCtx.createOscillator(), osc2 = audioCtx.createOscillator();
        osc1.type = 'sine'; osc1.frequency.value = baseFreq;
        osc2.type = 'triangle'; osc2.frequency.value = baseFreq * 0.5;
        const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass';
        const gain   = audioCtx.createGain();
        filter.frequency.setValueAtTime(400, now);
        filter.frequency.linearRampToValueAtTime(1200, now + duration * 0.4);
        filter.frequency.exponentialRampToValueAtTime(200, now + duration - gap);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.5, now + 1);
        gain.gain.setValueAtTime(0.5, now + duration - 1);
        gain.gain.linearRampToValueAtTime(0.001, now + duration - gap);
        osc1.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(pacerSwellGain);
        osc1.start(now); osc2.start(now); osc1.stop(now + duration - gap); osc2.stop(now + duration - gap);

    } else if (choice === 'chords') {
        const freqs = phaseType === 'inhale'
            ? [174.61, 261.63, 349.23, 440.00]
            : phaseType === 'exhale'
            ? [130.81, 196.00, 261.63, 329.63]
            : [196.00, 293.66, 392.00, 493.88];
        const gain = audioCtx.createGain();
        const maxG = 0.8 / freqs.length;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(maxG, now + 1.5);
        gain.gain.setValueAtTime(maxG, now + duration - 1);
        gain.gain.linearRampToValueAtTime(0.001, now + duration - gap);
        gain.connect(pacerSwellGain);
        freqs.forEach(f => {
            const osc = audioCtx.createOscillator();
            osc.type = 'sine'; osc.frequency.value = f;
            osc.connect(gain); osc.start(now); osc.stop(now + duration - gap);
        });

    } else if (choice === 'ocean') {
        const bufSize = Math.floor(audioCtx.sampleRate * 4);
        const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource(); noise.buffer = buf; noise.loop = true;
        const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.Q.value = 1;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.8, now + 1);
        gain.gain.setValueAtTime(0.8, now + duration - 1);
        gain.gain.linearRampToValueAtTime(0.001, now + duration - gap);
        if (phaseType === 'inhale') {
            filter.frequency.setValueAtTime(100, now);
            filter.frequency.linearRampToValueAtTime(800, now + duration);
        } else if (phaseType === 'exhale') {
            filter.frequency.setValueAtTime(800, now);
            filter.frequency.linearRampToValueAtTime(100, now + duration);
        } else {
            filter.frequency.setValueAtTime(300, now);
        }
        noise.connect(filter); filter.connect(gain); gain.connect(pacerSwellGain);
        noise.start(now); noise.stop(now + duration - gap);
    }
}

function playCompletionTone() {
    initAudio();
    const now = audioCtx.currentTime;
    const freqs = [261.63, 329.63, 392.00, 523.25];
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.12, now + 0.6);
    gain.gain.setValueAtTime(0.12, now + 2.5);
    gain.gain.linearRampToValueAtTime(0, now + 4);
    gain.connect(audioCtx.destination);
    freqs.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine'; osc.frequency.value = f;
        osc.connect(gain);
        osc.start(now + i * 0.08);
        osc.stop(now + 4);
    });
}

/* ═══════════════════════════════════════════════════════════════
   UTILITY
═══════════════════════════════════════════════════════════════ */
function easeInOut(t) { return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t; }

function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2,'0')}`;
}

function haptic() {
    if (hapticToggle.checked && 'vibrate' in navigator) navigator.vibrate(HAPTIC_MS);
}

/* ═══════════════════════════════════════════════════════════════
   ANIMATION LOOP
═══════════════════════════════════════════════════════════════ */
function loop(timestamp) {
    if (!sessionState.lastFrameTime) sessionState.lastFrameTime = timestamp;
    const dt = Math.min((timestamp - sessionState.lastFrameTime) / 1000, 0.1); // cap at 100ms
    sessionState.lastFrameTime = timestamp;

    if (sessionState.isRunning) {
        sessionState.totalTimeRemaining -= dt;
        sessionState.pendingSeconds     += dt;

        /* ── Session end ── */
        if (sessionState.totalTimeRemaining <= 0) {
            sessionState.totalTimeRemaining = 0;
            sessionState.isRunning = false;
            cancelAnimationFrame(sessionState.animationFrameId);
            flushStats();
            releaseWakeLock();
            stopKeepAlive();
            updateMediaSession('none');
            triggerAudio('inhale', 3, 523.25);
            setCircleScale(1);
            arcProgress.style.strokeDashoffset = ARC_CIRCUMFERENCE;
            instructionEl.textContent  = '';
            phaseCountdown.textContent = '';
            showCompleteOverlay();
            return;
        }

        /* ── Timer ── */
        timerDisplay.textContent = formatTime(sessionState.totalTimeRemaining);

        /* ── Pattern progress ── */
        sessionState.patternTime += dt;
        const phases       = sessionState.currentPattern;
        const cycleDuration = phases.reduce((s, p) => s + p.duration, 0);
        const t            = sessionState.patternTime % cycleDuration;

        let accumulated     = 0;
        let currentPhaseIdx = 0;
        for (let i = 0; i < phases.length; i++) {
            if (t >= accumulated && t < accumulated + phases[i].duration) {
                currentPhaseIdx = i; break;
            }
            accumulated += phases[i].duration;
        }

        /* ── Phase transition ── */
        if (currentPhaseIdx !== sessionState.lastPhaseIndex) {
            const phase = phases[currentPhaseIdx];

            // Count breath completions (each full inhale = one breath)
            if (phase.type === 'inhale' && sessionState.lastPhaseIndex !== -1) {
                sessionState.breathCount++;
            }

            triggerAudio(phase.type, phase.duration, phase.freq);
            instructionEl.textContent = phase.text;
            setPhaseColor(phase.type);
            haptic();

            // Hold-phase pulsing glow
            if (phase.type === 'hold') {
                circle.classList.add('hold-pulse');
            } else {
                circle.classList.remove('hold-pulse');
            }

            sessionState.lastPhaseIndex = currentPhaseIdx;
            sessionState.phaseStartTime = t;
        }

        /* ── Per-frame visuals ── */
        const phase     = phases[currentPhaseIdx];
        const phaseTime = t - accumulated;
        const progress  = phaseTime / phase.duration;
        const eased     = easeInOut(progress);

        // Circle scale
        let scale = CIRCLE_MIN_SCALE;
        if (phase.type === 'inhale') {
            scale = CIRCLE_MIN_SCALE + (CIRCLE_MAX_SCALE - CIRCLE_MIN_SCALE) * eased;
        } else if (phase.type === 'exhale') {
            scale = CIRCLE_MAX_SCALE - (CIRCLE_MAX_SCALE - CIRCLE_MIN_SCALE) * eased;
        } else {
            scale = phase.holdScale !== undefined ? phase.holdScale : CIRCLE_MIN_SCALE;
        }
        setCircleScale(scale);

        // Arc ring — depletes over the phase duration
        const arcFraction = 1 - progress; // 1 = full, 0 = empty
        arcProgress.style.strokeDashoffset = ARC_CIRCUMFERENCE * (1 - arcFraction);

        // Phase countdown (ceiling so "5" shows for full second)
        const secsLeft = Math.ceil(phase.duration * (1 - progress));
        phaseCountdown.textContent = secsLeft > 0 ? secsLeft : '';

        // Volume swell
        if (pacerSwellGain) {
            let swell = 1.0;
            if (phase.type === 'inhale') swell = 0.15 + 0.85 * progress;
            else if (phase.type === 'exhale') swell = 1.0 - 0.85 * progress;
            else swell = phase.holdScale === CIRCLE_HOLD_IN_SCALE ? 1.0 : 0.15;
            pacerSwellGain.gain.setTargetAtTime(swell, audioCtx.currentTime, 0.05);
        }
    }

    sessionState.animationFrameId = requestAnimationFrame(loop);
}

function setCircleScale(s) {
    document.documentElement.style.setProperty('--circle-scale', s);
    circle.style.transform = `scale(${s})`;
}

/* ═══════════════════════════════════════════════════════════════
   SESSION COMPLETE OVERLAY
═══════════════════════════════════════════════════════════════ */
function showCompleteOverlay() {
    // A few seconds of stillness first
    setTimeout(() => {
        playCompletionTone();

        const patternLabel = sessionState.currentPatternKey === 'custom'
            ? 'Custom Pattern'
            : (PATTERNS[sessionState.currentPatternKey]
                ? patternSelect.options[patternSelect.selectedIndex].text
                : 'Custom Pattern');

        const totalMins   = Math.round(sessionState.startingMinutes);
        const breaths     = sessionState.breathCount;

        completeStats.innerHTML =
            `<strong>${totalMins} min</strong> of ${patternLabel}<br>` +
            `~${breaths} breath cycles completed`;

        completeOverlay.classList.add('visible');
        requestAnimationFrame(() => {
            requestAnimationFrame(() => completeOverlay.classList.add('shown'));
        });

        setUiState('idle');
        document.body.classList.remove('session-active');

    }, COMPLETION_HOLD_SEC * 1000);
}

completeBtn.addEventListener('click', () => {
    completeOverlay.classList.remove('shown');
    setTimeout(() => completeOverlay.classList.remove('visible'), 600);
    resetSession();
});

/* ═══════════════════════════════════════════════════════════════
   UI STATE HELPERS
═══════════════════════════════════════════════════════════════ */
function setUiState(state) {
    // state: 'idle' | 'running' | 'paused'
    if (state === 'running') {
        startBtn.disabled  = true;
        pauseBtn.disabled  = false;
        patternSelect.disabled = true;
        soundSelect.disabled   = true;
        minutesInput.disabled  = true;
        document.querySelectorAll('.custom-cell input').forEach(i => i.disabled = true);
    } else {
        startBtn.disabled  = false;
        pauseBtn.disabled  = true;
        patternSelect.disabled = false;
        soundSelect.disabled   = false;
        minutesInput.disabled  = false;
        document.querySelectorAll('.custom-cell input').forEach(i => i.disabled = false);
    }
}

/* ═══════════════════════════════════════════════════════════════
   SESSION CONTROLS
═══════════════════════════════════════════════════════════════ */
function startSession() {
    if (sessionState.isRunning) return;

    initAudio();
    requestWakeLock();
    playAmbient();
    setupMediaSession();
    startKeepAlive();

    sessionState.isRunning = true;
    sessionState.lastFrameTime = 0;
    setUiState('running');

    // Collapse settings, show session top row
    closeSettings();
    document.body.classList.add('session-active');
    updateQuickPauseBtn();

    // Unlock audio context (iOS)
    const unlock = audioCtx.createOscillator();
    const ug = audioCtx.createGain(); ug.gain.value = 0;
    unlock.connect(ug); ug.connect(pacerSwellGain);
    unlock.start(); unlock.stop(audioCtx.currentTime + 0.1);

    if (sessionState.patternTime === 0) {
        sessionState.startingMinutes  = parseInt(minutesInput.value) || 16;
        sessionState.totalTimeRemaining = sessionState.startingMinutes * 60;
    }

    pacerSwellGain.gain.setTargetAtTime(1, audioCtx.currentTime, 0.05);
    updateMediaSession('playing');
    sessionState.animationFrameId = requestAnimationFrame(loop);
}

function pauseSession() {
    sessionState.isRunning = false;
    cancelAnimationFrame(sessionState.animationFrameId);
    flushStats();
    releaseWakeLock();
    setUiState('paused');
    instructionEl.textContent  = 'Paused';
    phaseCountdown.textContent = '';
    if (pacerSwellGain) pacerSwellGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
    updateMediaSession('paused');
    updateQuickPauseBtn();
    // Keep keepAlive running so audio context stays warm for resume
}

function resetSession() {
    sessionState.isRunning          = false;
    sessionState.patternTime        = 0;
    sessionState.lastFrameTime      = 0;
    sessionState.lastPhaseIndex     = -1;
    sessionState.breathCount        = 0;
    sessionState.startingMinutes    = parseInt(minutesInput.value) || 16;
    sessionState.totalTimeRemaining = sessionState.startingMinutes * 60;

    cancelAnimationFrame(sessionState.animationFrameId);
    flushStats();
    releaseWakeLock();
    stopKeepAlive();
    updateMediaSession('none');
    setUiState('idle');

    document.body.classList.remove('session-active');
    openSettings();

    setCircleScale(1);
    circle.classList.remove('hold-pulse');
    arcProgress.style.strokeDashoffset = ARC_CIRCUMFERENCE;

    timerDisplay.textContent   = formatTime(sessionState.totalTimeRemaining);
    instructionEl.textContent  = 'Ready to breathe';
    phaseCountdown.textContent = '';
    setPhaseColor('exhale'); // neutral teal at rest

    if (pacerSwellGain) pacerSwellGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
}

startBtn.addEventListener('click', () => { startSession(); updateQuickPauseBtn(); });
pauseBtn.addEventListener('click', () => { pauseSession(); updateQuickPauseBtn(); });
resetBtn.addEventListener('click', resetSession);

/* ═══════════════════════════════════════════════════════════════
   CUSTOM PATTERN
═══════════════════════════════════════════════════════════════ */
function buildCustomPattern() {
    const inV  = parseInt(cIn.value)  || 1;
    const h1V  = parseInt(cH1.value)  || 0;
    const outV = parseInt(cOut.value) || 1;
    const h2V  = parseInt(cH2.value)  || 0;
    const p = [];
    if (inV  > 0) p.push({type:'inhale', text:'Inhale', duration:inV,  freq:523.25});
    if (h1V  > 0) p.push({type:'hold',   text:'Hold',   duration:h1V,  holdScale:CIRCLE_HOLD_IN_SCALE,  freq:329.63});
    if (outV > 0) p.push({type:'exhale', text:'Exhale', duration:outV, freq:392.00});
    if (h2V  > 0) p.push({type:'hold',   text:'Hold',   duration:h2V,  holdScale:CIRCLE_HOLD_OUT_SCALE, freq:329.63});
    sessionState.currentPattern    = p;
    sessionState.currentPatternKey = 'custom';
}

patternSelect.addEventListener('change', e => {
    updatePatternDescription(e.target.value);
    if (e.target.value === 'custom') {
        customRow.style.display = 'grid';
        buildCustomPattern();
    } else {
        customRow.style.display = 'none';
        sessionState.currentPattern    = PATTERNS[e.target.value].phases;
        sessionState.currentPatternKey = e.target.value;
    }
    resetSession();
});

document.querySelectorAll('.custom-cell input').forEach(el => {
    el.addEventListener('change', () => {
        if (patternSelect.value === 'custom') { buildCustomPattern(); resetSession(); }
    });
});

minutesInput.addEventListener('change', e => {
    let val = parseInt(e.target.value);
    if (val < 1)  val = 1;
    if (val > 60) val = 60;
    e.target.value = val;
    sessionState.startingMinutes    = val;
    sessionState.totalTimeRemaining = val * 60;
    timerDisplay.textContent = formatTime(sessionState.totalTimeRemaining);
});

/* ═══════════════════════════════════════════════════════════════
   PAGE LIFECYCLE — audio resume + wake lock on Android
═══════════════════════════════════════════════════════════════ */

function restoreAudioAndLock() {
    // Resume the AudioContext — Android Chrome suspends it on screen-lock
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    if (sessionState.isRunning) {
        // Wake lock is released automatically when the page hides; re-request it
        requestWakeLock();
        updateMediaSession('playing');
        // Restart ambient buffer source — it stops when the context was suspended
        if (ambientSelect.value !== 'none') playAmbient();
    }
}

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
        flushStats();
    } else if (document.visibilityState === 'visible') {
        restoreAudioAndLock();
    }
});

// pageshow fires on bfcache restore — another path where Android Chrome
// can leave the AudioContext suspended
window.addEventListener('pageshow', (e) => {
    if (e.persisted) restoreAudioAndLock();
});

window.addEventListener('pagehide', flushStats);

/* ═══════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════ */
loadStats();
timerDisplay.textContent = formatTime(sessionState.totalTimeRemaining);
setPhaseColor('exhale');
</script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(() => console.log('SW registered'));
    }
</script>
