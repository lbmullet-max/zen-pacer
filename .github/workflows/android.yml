name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write   # lets the main-branch build publish a downloadable release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Copy web files into the Android project
        run: npm run sync

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk zen-pacer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zen-pacer-apk
          path: zen-pacer.apk

      # Only builds of main publish a release you can download from your phone.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest zen-pacer.apk \
            --title "Zen Pacer (latest)" \
            --notes "Latest build of the Zen Pacer Android app. Download zen-pacer.apk and open it on your phone to install." \
            --target "$GITHUB_SHA"
