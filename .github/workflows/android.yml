name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write   # lets the main-branch build publish a downloadable release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Copy web files into the Android project
        run: npm run sync

      # The signing key is stored encrypted in the repo (signing/zenpacer.keystore.enc).
      # Add the passphrase as a repository secret named ZEN_SIGNING_PASSPHRASE to use it.
      - name: Use the permanent signing key (if the secret is set)
        env:
          SIGNING_PASSPHRASE: ${{ secrets.ZEN_SIGNING_PASSPHRASE }}
        run: |
          if [ -n "$SIGNING_PASSPHRASE" ]; then
            if [ ! -f signing/zenpacer.keystore.enc ]; then
              echo "::error::The ZEN_SIGNING_PASSPHRASE secret is set, but there is no key file yet. Run the 'Create signing key' workflow first."
              exit 1
            fi
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SIGNING_PASSPHRASE \
              -in signing/zenpacer.keystore.enc -out "$RUNNER_TEMP/zenpacer.keystore" \
              || { echo "::error::The ZEN_SIGNING_PASSPHRASE secret doesn't open signing/zenpacer.keystore.enc. Check the secret."; exit 1; }
            echo "ZEN_KEYSTORE_FILE=$RUNNER_TEMP/zenpacer.keystore" >> "$GITHUB_ENV"
            echo "ZEN_SIGNING_PASSPHRASE=$SIGNING_PASSPHRASE" >> "$GITHUB_ENV"
            echo "Signing with the permanent key."
          else
            echo "::warning::ZEN_SIGNING_PASSPHRASE secret is not set, so this APK uses a temporary key. Uninstall the old app before installing it."
          fi

      - name: Build APK
        working-directory: android
        env:
          ZEN_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Show which key signed the APK
        continue-on-error: true   # information only
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk 2>&1 | grep -iE "verified|certificate SHA-256|error" || true

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk zen-pacer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zen-pacer-apk
          path: zen-pacer.apk

      # Only builds of main publish a release you can download from your phone.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest zen-pacer.apk \
            --title "Zen Pacer (latest)" \
            --notes "Latest build of the Zen Pacer Android app. Download zen-pacer.apk and open it on your phone to install. Newer builds install over older ones (no need to uninstall) once the signing secret is set up." \
            --target "$GITHUB_SHA"

  # Boots the APK on an emulator and checks the app really runs.
  # Manual only: Actions tab > Build Android APK > Run workflow.
  smoke-test:
    needs: apk
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: zen-pacer-apk

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: bash scripts/smoke-test.sh
