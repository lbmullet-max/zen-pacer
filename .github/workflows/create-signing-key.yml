name: Create signing key

# One-time setup, run by hand: Actions tab > "Create signing key" > Run workflow.
# Needs the repository secret ZEN_SIGNING_PASSPHRASE (a passphrase you choose).
on:
  workflow_dispatch:
    inputs:
      replace:
        description: "Replace an existing key that this passphrase can't open (apps signed with the old key must then be uninstalled)"
        type: boolean
        default: false

permissions:
  contents: write   # lets this workflow save the encrypted key into the repo

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create the key
        env:
          PASSPHRASE: ${{ secrets.ZEN_SIGNING_PASSPHRASE }}
          REPLACE: ${{ inputs.replace }}
        run: ./scripts/create-signing-key.sh

      - name: Save the encrypted key to the repo
        run: |
          if [ -n "$(git status --porcelain signing)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/zenpacer.keystore.enc
            git commit -m "Add the app's encrypted signing key"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No change to save."
          fi
