<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1a271d" id="meta-theme"><title>Zen Pacer</title><link rel="icon" type="image/png" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.json"><style>body {display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; color: #d6e3db; font-family: system-ui, -apple-system, sans-serif; overflow-y: auto; overscroll-behavior-y: none; background: linear-gradient(135deg, #1a271d, #0d1610);}.glass-panel {background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; align-items: center; z-index: 10; margin-bottom: 20px; width: 90%; max-width: 400px; box-sizing: border-box;}#settings-panel {display: none; flex-direction: column; gap: 15px; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; margin-bottom: 15px;}#settings-panel.open {display: flex;}.controls-row {display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; width: 100%;}select, input[type="number"] {background: rgba(0, 0, 0, 0.2); color: #d6e3db; border: 1px solid rgba(255, 255, 255, 0.15); padding: 8px 12px; border-radius: 8px; font-size: 1rem; outline: none; flex-grow: 1;}input[type="number"] {width: 60px; text-align: center; flex-grow: 0;}.custom-label {display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; opacity: 0.8; gap: 4px;}.custom-input {width: 45px !important; padding: 6px !important;}button {padding: 10px 20px; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: transform 0.1s, opacity 0.2s; background-color: #527961; color: #0d1610;}button:active {transform: scale(0.95);}button:disabled {opacity: 0.5; cursor: not-allowed;}#toggle-settings-btn {background: transparent; color: #8ba997; border: 1px solid rgba(139, 169, 151, 0.3); padding: 6px 14px; font-size: 0.9rem; font-weight: normal; margin-bottom: 10px; width: 100%;}.mixer-row {display: flex; gap: 20px; width: 100%; justify-content: space-between;}.mixer-col {display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 0.85rem; opacity: 0.9; width: 48%;}input[type="range"] {width: 100%; accent-color: #7ba98b;}#timer-display {font-size: 2.8rem; font-weight: 300; letter-spacing: 2px; margin-top: 5px; font-variant-numeric: tabular-nums;}#stats-display {font-size: 0.85rem; opacity: 0.6; letter-spacing: 1px; margin-top: -5px;}#instruction {font-size: 1.5rem; font-weight: 300; margin: 15px 0 25px 0; min-height: 2rem; letter-spacing: 1px; z-index: 10; text-align: center;}.pacer-container {width: 250px; height: 250px; display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; margin-bottom: 20px;}.circle {width: 100px; height: 100px; border-radius: 50%; opacity: 0.85; will-change: transform; background: radial-gradient(circle, #7ba98b, #446b52); box-shadow: 0 0 50px rgba(123, 169, 139, 0.2), inset 0 0 20px rgba(255,255,255,0.2);}</style></head><body><div class="glass-panel"><button id="toggle-settings-btn">🌿 Tune Environment</button><div id="settings-panel"><div class="controls-row"><select id="pattern-select"><option value="4-6">Relax (4:6)</option><option value="5-5">Coherent (5:5)</option><option value="box">Box (4-4-4-4)</option><option value="4-7-8">Deep Rest (4-7-8)</option><option value="4-2-4-2">Balanced (4-2-4-2)</option><option value="custom">Custom Setup...</option></select><div><input type="number" id="minutes-input" value="16" min="1" max="60"> min</div></div><div class="controls-row" id="custom-row" style="display: none; margin-top: 5px;"><div class="custom-label"><label>In</label><input type="number" class="custom-input" id="c-in" value="4" min="1" max="20"></div><div class="custom-label"><label>Hold</label><input type="number" class="custom-input" id="c-h1" value="2" min="0" max="20"></div><div class="custom-label"><label>Out</label><input type="number" class="custom-input" id="c-out" value="6" min="1" max="20"></div><div class="custom-label"><label>Hold</label><input type="number" class="custom-input" id="c-h2" value="0" min="0" max="20"></div></div><div class="controls-row" style="margin-top: 5px;"><select id="sound-select"><option value="chords">Resolving Chords</option><option value="warm">Warm Synth</option><option value="ocean">Ocean Waves</option><option value="sine">Basic Sine</option><option value="mute">Mute</option></select><select id="ambient-select"><option value="none">No Background</option><option value="rain">Soft Rain</option><option value="wind">Gentle Wind</option><option value="stream">Forest Stream</option></select></div><div class="mixer-row"><div class="mixer-col"><label>Breathing Vol</label><input type="range" id="pacer-vol-slider" min="0" max="1" step="0.01" value="1"></div><div class="mixer-col"><label>Nature Vol</label><input type="range" id="ambient-vol-slider" min="0" max="1" step="0.01" value="0.35"></div></div></div><div class="controls-row"><button id="start-btn">Start</button><button id="pause-btn" disabled>Pause</button><button id="reset-btn">Reset</button></div><div id="timer-display">16:00</div><div id="stats-display">Streak: 0 Days | Total: 0 Mins</div></div><div id="instruction">Ready to breathe</div><div class="pacer-container"><div class="circle" id="circle"></div></div><script>let audioCtx; let pacerSwellGain; let pacerVolGain; let ambientVolGain; let wakeLock = null; let ambientNode = null; let ambientFilter = null; let windLfo = null; let windLfoGain = null; const patterns = {'4-6': [{type: 'inhale', text: 'Inhale...', duration: 4, freq: 523.25}, {type: 'exhale', text: 'Exhale...', duration: 6, freq: 392.00}], '5-5': [{type: 'inhale', text: 'Inhale...', duration: 5, freq: 523.25}, {type: 'exhale', text: 'Exhale...', duration: 5, freq: 392.00}], 'box': [{type: 'inhale', text: 'Inhale...', duration: 4, freq: 523.25}, {type: 'hold', text: 'Hold...', duration: 4, holdScale: 2.5, freq: 329.63}, {type: 'exhale', text: 'Exhale...', duration: 4, freq: 392.00}, {type: 'hold', text: 'Hold...', duration: 4, holdScale: 1.0, freq: 329.63}], '4-7-8': [{type: 'inhale', text: 'Inhale...', duration: 4, freq: 523.25}, {type: 'hold', text: 'Hold...', duration: 7, holdScale: 2.5, freq: 329.63}, {type: 'exhale', text: 'Exhale...', duration: 8, freq: 392.00}], '4-2-4-2': [{type: 'inhale', text: 'Inhale...', duration: 4, freq: 523.25}, {type: 'hold', text: 'Hold...', duration: 2, holdScale: 2.5, freq: 329.63}, {type: 'exhale', text: 'Exhale...', duration: 4, freq: 392.00}, {type: 'hold', text: 'Hold...', duration: 2, holdScale: 1.0, freq: 329.63}]}; let isRunning = false; let lastFrameTime = 0; let patternTime = 0; let startingMinutes = 16; let totalTimeRemaining = startingMinutes * 60; let pendingSeconds = 0; let currentPattern = patterns['4-6']; let lastPhaseIndex = -1; let animationFrameId; let currentStats = {totalSeconds: 0, streak: 0, lastDate: ''}; const circle = document.getElementById('circle'); const instructionText = document.getElementById('instruction'); const timerDisplay = document.getElementById('timer-display'); const statsDisplay = document.getElementById('stats-display'); const patternSelect = document.getElementById('pattern-select'); const soundSelect = document.getElementById('sound-select'); const ambientSelect = document.getElementById('ambient-select'); const minutesInput = document.getElementById('minutes-input'); const pacerVolSlider = document.getElementById('pacer-vol-slider'); const ambientVolSlider = document.getElementById('ambient-vol-slider'); const startBtn = document.getElementById('start-btn'); const pauseBtn = document.getElementById('pause-btn'); const resetBtn = document.getElementById('reset-btn'); const toggleSettingsBtn = document.getElementById('toggle-settings-btn'); const settingsPanel = document.getElementById('settings-panel'); const customRow = document.getElementById('custom-row'); const cIn = document.getElementById('c-in'); const cH1 = document.getElementById('c-h1'); const cOut = document.getElementById('c-out'); const cH2 = document.getElementById('c-h2'); toggleSettingsBtn.addEventListener('click', () => {settingsPanel.classList.toggle('open');}); async function requestWakeLock() {try {if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }} catch (err) {}} function releaseWakeLock() {if (wakeLock !== null) { wakeLock.release(); wakeLock = null; }} function loadStats() {try {let saved = localStorage.getItem('zenStats'); if (saved) {currentStats = JSON.parse(saved); if (currentStats.totalMins !== undefined) {currentStats.totalSeconds = currentStats.totalMins * 60; delete currentStats.totalMins; localStorage.setItem('zenStats', JSON.stringify(currentStats));}}} catch(e) {} let totalMinsDisplay = Math.floor((currentStats.totalSeconds || 0) / 60); statsDisplay.innerText = `Streak: ${currentStats.streak || 0} Days | Total: ${totalMinsDisplay} Mins`;} function saveSessionStats(secondsCompleted) {if(secondsCompleted <= 0) return; const today = new Date().toDateString(); if (currentStats.lastDate !== today) {const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1); if (currentStats.lastDate === yesterday.toDateString()) { currentStats.streak += 1; } else if (currentStats.lastDate !== today) { currentStats.streak = 1; } currentStats.lastDate = today;} currentStats.totalSeconds += secondsCompleted; try { localStorage.setItem('zenStats', JSON.stringify(currentStats)); } catch(e) {} loadStats();} function flushStats() {if (pendingSeconds > 0) { saveSessionStats(pendingSeconds); pendingSeconds = 0; }} function initAudio() {if (!audioCtx) {audioCtx = new (window.AudioContext || window.webkitAudioContext)(); pacerSwellGain = audioCtx.createGain(); pacerVolGain = audioCtx.createGain(); ambientVolGain = audioCtx.createGain(); pacerVolGain.gain.value = pacerVolSlider.value; ambientVolGain.gain.value = ambientVolSlider.value; pacerSwellGain.connect(pacerVolGain); pacerVolGain.connect(audioCtx.destination); ambientVolGain.connect(audioCtx.destination);} if (audioCtx.state === 'suspended') audioCtx.resume();} function playAmbient() {if (ambientNode) { ambientNode.stop(); ambientNode.disconnect(); ambientNode = null; } if (ambientFilter) { ambientFilter.disconnect(); ambientFilter = null; } if (windLfo) { windLfo.stop(); windLfo.disconnect(); windLfo = null; } if (windLfoGain) { windLfoGain.disconnect(); windLfoGain = null; } const type = ambientSelect.value; if (type === 'none') return; initAudio(); const bufferSize = audioCtx.sampleRate * 2; const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate); const data = buffer.getChannelData(0); let lastOut = 0; for (let i = 0; i < bufferSize; i++) {const white = Math.random() * 2 - 1; data[i] = (lastOut + (0.02 * white)) / 1.02; lastOut = data[i]; data[i] *= 3.5;} ambientNode = audioCtx.createBufferSource(); ambientNode.buffer = buffer; ambientNode.loop = true; ambientFilter = audioCtx.createBiquadFilter(); if (type === 'rain') {ambientFilter.type = 'lowpass'; ambientFilter.frequency.value = 800; ambientFilter.Q.value = 0.5;} else if (type === 'stream') {ambientFilter.type = 'lowpass'; ambientFilter.frequency.value = 350; ambientFilter.Q.value = 0.5;} else if (type === 'wind') {ambientFilter.type = 'bandpass'; ambientFilter.frequency.value = 250; ambientFilter.Q.value = 0.5; windLfo = audioCtx.createOscillator(); windLfo.type = 'sine'; windLfo.frequency.value = 0.05; windLfoGain = audioCtx.createGain(); windLfoGain.gain.value = 150; windLfo.connect(windLfoGain); windLfoGain.connect(ambientFilter.frequency); windLfo.start();} ambientNode.connect(ambientFilter); ambientFilter.connect(ambientVolGain); ambientNode.start();} ambientSelect.addEventListener('change', () => { initAudio(); playAmbient(); }); pacerVolSlider.addEventListener('input', (e) => { if (pacerVolGain) pacerVolGain.gain.setTargetAtTime(e.target.value, audioCtx.currentTime, 0.1); }); ambientVolSlider.addEventListener('input', (e) => { if (ambientVolGain) ambientVolGain.gain.setTargetAtTime(e.target.value, audioCtx.currentTime, 0.1); }); function buildCustomPattern() {let inV = parseInt(cIn.value)||1; let h1V = parseInt(cH1.value)||0; let outV = parseInt(cOut.value)||1; let h2V = parseInt(cH2.value)||0; let p = []; if(inV>0) p.push({type:'inhale',text:'Inhale...',duration:inV,freq:523.25}); if(h1V>0) p.push({type:'hold',text:'Hold...',duration:h1V,holdScale:2.5,freq:329.63}); if(outV>0) p.push({type:'exhale',text:'Exhale...',duration:outV,freq:392.00}); if(h2V>0) p.push({type:'hold',text:'Hold...',duration:h2V,holdScale:1.0,freq:329.63}); currentPattern = p;} function triggerAudio(phaseType, duration, baseFreq, text) {const soundChoice = soundSelect.value; if (soundChoice === 'mute' || !audioCtx || !pacerSwellGain) return; if (audioCtx.state === 'suspended') audioCtx.resume(); const now = audioCtx.currentTime; const gap = 0.15; if (soundChoice === 'sine') {const osc = audioCtx.createOscillator(); osc.type = 'sine'; osc.frequency.value = baseFreq; const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.5, now + 1); gain.gain.setValueAtTime(0.5, now + duration - 1); gain.gain.linearRampToValueAtTime(0.001, now + duration - gap); osc.connect(gain); gain.connect(pacerSwellGain); osc.start(now); osc.stop(now + duration - gap);} else if (soundChoice === 'warm') {const osc1 = audioCtx.createOscillator(); osc1.type = 'sine'; osc1.frequency.value = baseFreq; const osc2 = audioCtx.createOscillator(); osc2.type = 'triangle'; osc2.frequency.value = baseFreq * 0.5; const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; const gain = audioCtx.createGain(); filter.frequency.setValueAtTime(400, now); filter.frequency.linearRampToValueAtTime(1200, now + duration * 0.4); filter.frequency.exponentialRampToValueAtTime(200, now + duration - gap); gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.5, now + 1); gain.gain.setValueAtTime(0.5, now + duration - 1); gain.gain.linearRampToValueAtTime(0.001, now + duration - gap); osc1.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(pacerSwellGain); osc1.start(now); osc2.start(now); osc1.stop(now + duration - gap); osc2.stop(now + duration - gap);} else if (soundChoice === 'chords') {let freqs = []; if (phaseType === 'inhale') freqs = [174.61, 261.63, 349.23, 440.00]; else if (phaseType === 'exhale') freqs = [130.81, 196.00, 261.63, 329.63]; else freqs = [196.00, 293.66, 392.00, 493.88]; const gain = audioCtx.createGain(); const maxGain = 0.8 / freqs.length; gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(maxGain, now + 1.5); gain.gain.setValueAtTime(maxGain, now + duration - 1); gain.gain.linearRampToValueAtTime(0.001, now + duration - gap); gain.connect(pacerSwellGain); freqs.forEach(f => { const osc = audioCtx.createOscillator(); osc.type = 'sine'; osc.frequency.value = f; osc.connect(gain); osc.start(now); osc.stop(now + duration - gap); });} else if (soundChoice === 'ocean') {const bufferSize = Math.floor(audioCtx.sampleRate * 4); const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate); const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1; const noise = audioCtx.createBufferSource(); noise.buffer = buffer; noise.loop = true; const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.Q.value = 1; const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.8, now + 1); gain.gain.setValueAtTime(0.8, now + duration - 1); gain.gain.linearRampToValueAtTime(0.001, now + duration - gap); if (phaseType === 'inhale') { filter.frequency.setValueAtTime(100, now); filter.frequency.linearRampToValueAtTime(800, now + duration); } else if (phaseType === 'exhale') { filter.frequency.setValueAtTime(800, now); filter.frequency.linearRampToValueAtTime(100, now + duration); } else { filter.frequency.setValueAtTime(300, now); } noise.connect(filter); filter.connect(gain); gain.connect(pacerSwellGain); noise.start(now); noise.stop(now + duration - gap);}} function easeInOut(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; } function formatTime(seconds) { const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60); return `${m}:${s.toString().padStart(2, '0')}`; } function loop(timestamp) {if (!lastFrameTime) { lastFrameTime = timestamp; } const dt = (timestamp - lastFrameTime) / 1000; lastFrameTime = timestamp; if (isRunning) {totalTimeRemaining -= dt; pendingSeconds += dt; if (totalTimeRemaining <= 0) {totalTimeRemaining = 0; isRunning = false; cancelAnimationFrame(animationFrameId); instructionText.innerText = "Session Complete"; triggerAudio('inhale', 3, 523.25, 'Session complete'); flushStats(); releaseWakeLock(); startBtn.disabled = false; pauseBtn.disabled = true; patternSelect.disabled = false; soundSelect.disabled = false; minutesInput.disabled = false; document.querySelectorAll('.custom-input').forEach(i=>i.disabled=false); circle.style.transform = 'scale(1)'; return;} timerDisplay.innerText = formatTime(totalTimeRemaining); patternTime += dt; let totalDuration = currentPattern.reduce((sum, phase) => sum + phase.duration, 0); let t = patternTime % totalDuration; let accumulated = 0; let currentPhaseIndex = 0; for (let i = 0; i < currentPattern.length; i++) { if (t >= accumulated && t < accumulated + currentPattern[i].duration) { currentPhaseIndex = i; break; } accumulated += currentPattern[i].duration; } if (currentPhaseIndex !== lastPhaseIndex) { const phase = currentPattern[currentPhaseIndex]; triggerAudio(phase.type, phase.duration, phase.freq, phase.text); instructionText.innerText = phase.text; lastPhaseIndex = currentPhaseIndex; } let phaseTime = t - accumulated; let progress = phaseTime / currentPattern[currentPhaseIndex].duration; let eased = easeInOut(progress); let scale = 1; const phase = currentPattern[currentPhaseIndex]; if (phase.type === 'inhale') scale = 1 + (1.5 * eased); else if (phase.type === 'exhale') scale = 2.5 - (1.5 * eased); else if (phase.type === 'hold') scale = phase.holdScale; circle.style.transform = `scale(${scale})`; if (pacerSwellGain) { let swellVolume = 1.0; if (phase.type === 'inhale') { swellVolume = 0.15 + (0.85 * progress); } else if (phase.type === 'exhale') { swellVolume = 1.0 - (0.85 * progress); } else if (phase.type === 'hold') { swellVolume = phase.holdScale === 2.5 ? 1.0 : 0.15; } pacerSwellGain.gain.setTargetAtTime(swellVolume, audioCtx.currentTime, 0.05); }} animationFrameId = requestAnimationFrame(loop);} function startSession() {if (!isRunning) {initAudio(); requestWakeLock(); isRunning = true; settingsPanel.classList.remove('open'); pacerSwellGain.gain.setTargetAtTime(1, audioCtx.currentTime, 0.05); const unlockOsc = audioCtx.createOscillator(); const unlockGain = audioCtx.createGain(); unlockGain.gain.value = 0; unlockOsc.connect(unlockGain); unlockGain.connect(pacerSwellGain); unlockOsc.start(audioCtx.currentTime); unlockOsc.stop(audioCtx.currentTime + 0.1); if (patternTime === 0 && totalTimeRemaining === parseInt(minutesInput.value) * 60) {startingMinutes = parseInt(minutesInput.value); totalTimeRemaining = startingMinutes * 60;} lastFrameTime = 0; animationFrameId = requestAnimationFrame(loop); startBtn.disabled = true; pauseBtn.disabled = false; patternSelect.disabled = true; soundSelect.disabled = true; minutesInput.disabled = true; document.querySelectorAll('.custom-input').forEach(i=>i.disabled=true);}} function pauseSession() {isRunning = false; cancelAnimationFrame(animationFrameId); flushStats(); releaseWakeLock(); startBtn.disabled = false; pauseBtn.disabled = true; instructionText.innerText = "Paused"; if (pacerSwellGain) { pacerSwellGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1); }} function resetSession() {isRunning = false; cancelAnimationFrame(animationFrameId); flushStats(); releaseWakeLock(); patternTime = 0; lastFrameTime = 0; lastPhaseIndex = -1; startingMinutes = parseInt(minutesInput.value); totalTimeRemaining = startingMinutes * 60; timerDisplay.innerText = formatTime(totalTimeRemaining); circle.style.transform = 'scale(1)'; instructionText.innerText = "Ready to breathe"; if (pacerSwellGain) { pacerSwellGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1); } startBtn.disabled = false; pauseBtn.disabled = true; patternSelect.disabled = false; soundSelect.disabled = false; minutesInput.disabled = false; document.querySelectorAll('.custom-input').forEach(i=>i.disabled=false);} startBtn.addEventListener('click', startSession); pauseBtn.addEventListener('click', pauseSession); resetBtn.addEventListener('click', resetSession); patternSelect.addEventListener('change', (e) => { if(e.target.value === 'custom') { customRow.style.display = 'flex'; buildCustomPattern(); } else { customRow.style.display = 'none'; currentPattern = patterns[e.target.value]; } resetSession(); }); document.querySelectorAll('.custom-input').forEach(el => { el.addEventListener('change', () => { if(patternSelect.value === 'custom') { buildCustomPattern(); resetSession(); } }); }); minutesInput.addEventListener('change', (e) => {let val = parseInt(e.target.value); if(val < 1) val = 1; if(val > 60) val = 60; e.target.value = val; startingMinutes = val; totalTimeRemaining = val * 60; timerDisplay.innerText = formatTime(totalTimeRemaining);}); document.addEventListener('visibilitychange', () => {if (document.visibilityState === 'hidden') { flushStats(); } else if (document.visibilityState === 'visible' && isRunning) { requestWakeLock(); }}); window.addEventListener('pagehide', flushStats); loadStats(); timerDisplay.innerText = formatTime(totalTimeRemaining);</script></body></html>
