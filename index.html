<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff" id="meta-theme">
    <title>Breathing is Beautiful</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <script>
        // Pick light or dark before anything is drawn: your saved choice, otherwise the phone's setting.
        (function () {
            var t = null;
            try { t = localStorage.getItem('zenPacerTheme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') {
                t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <style>
        /* ─── Light & dark themes (chosen in Settings) ───────────────── */
        :root {
            color-scheme: light;
            --bg: #ffffff;
            --surface: #f2f2f2;
            --text: #161616;
            --muted: #666666;
            --border: #d6d6d6;
            --accent: #1a1a1a;
            --accent-text: #ffffff;
            --circle-scale: 1;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #000000;
            --surface: #161616;
            --text: #eeeeee;
            --muted: #9b9b9b;
            --border: #2e2e2e;
            --accent: #e8e8e8;
            --accent-text: #000000;
        }

        /* ─── Reset & Base ────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top, 0px);
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            overscroll-behavior-y: none;
        }

        /* ─── Layout wrapper ─────────────────────────────────────────── */
        #app {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 460px;
            padding: 16px 16px 24px;
        }

        /* ─── Control panel ──────────────────────────────────────────── */
        #control-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            width: 100%;
            margin-bottom: 20px;
        }

        #panel-header {
            display: flex;
            align-items: center;
            width: 100%;
        }

        /* Mid-session: only a Settings button and a Pause button */
        #session-top-row {
            display: none;
            gap: 8px;
            width: 100%;
            margin-bottom: 4px;
            align-items: center;
        }
        body.session-active #panel-header { display: none; }
        body.session-active #session-top-row { display: flex; }
        body.session-active .btn-row { display: none; }
        #quick-pause-btn { flex: 1; }
        #quick-pause-btn.is-paused {
            background: var(--accent);
            color: var(--accent-text);
            border-color: var(--accent);
        }

        /* The collapsible settings body */
        #settings-body {
            overflow: hidden;
            max-height: 600px;
            transition: max-height 0.3s ease, opacity 0.2s ease, margin-top 0.2s ease;
            margin-top: 10px;
            opacity: 1;
        }
        #settings-body.collapsed {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }

        .settings-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 10px;
        }
        .settings-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
        }
        .options { justify-content: space-between; }
        .check {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--muted);
            white-space: nowrap;
            cursor: pointer;
        }
        .check input {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }
        .muted {
            color: var(--muted);
            font-size: 0.85rem;
            white-space: nowrap;
        }

        #pattern-wrap { width: 100%; }
        #pattern-select { width: 100%; }
        #pattern-description {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 4px;
            min-height: 1.1em;
        }

        /* ─── Form controls ──────────────────────────────────────────── */
        select, input[type="number"] {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            flex-grow: 1;
        }
        input[type="number"] {
            width: 64px;
            text-align: center;
            flex-grow: 0;
        }
        .mixer-row { display: flex; width: 100%; }
        .mixer-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.78rem;
            color: var(--muted);
            flex: 1;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        /* ─── Buttons ────────────────────────────────────────────────── */
        button {
            padding: 10px 20px;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 500;
            border: 1px solid var(--accent);
            border-radius: 8px;
            cursor: pointer;
            background: var(--accent);
            color: var(--accent-text);
        }
        button:active { opacity: 0.8; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        #pause-btn, #reset-btn, #toggle-settings-btn, #mini-reveal-btn, #quick-pause-btn, #mini-reset-btn {
            background: transparent;
            color: var(--text);
            border-color: var(--border);
        }
        #toggle-settings-btn, #mini-reveal-btn, #mini-reset-btn {
            font-size: 0.8rem;
            font-weight: 400;
            padding: 5px 14px;
            white-space: nowrap;
        }
        #quick-pause-btn { padding: 7px 14px; font-size: 0.85rem; font-weight: 400; }

        .btn-row {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        /* ─── Timer, instruction, countdown ──────────────────────────── */
        #timer-display {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }
        #instruction {
            font-size: 1.6rem;
            font-weight: 500;
            margin: 20px 0 8px;
            min-height: 2.2rem;
            text-align: center;
        }
        #phase-countdown {
            font-size: 1.1rem;
            color: var(--muted);
            margin-bottom: 16px;
            min-height: 1.5rem;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* ─── Breathing circle + progress ring ───────────────────────── */
        .pacer-container {
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            margin-bottom: 10px;
        }
        #arc-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform: rotate(-90deg);
            pointer-events: none;
        }
        #arc-track {
            fill: none;
            stroke: var(--border);
            stroke-width: 4;
        }
        #arc-progress {
            fill: none;
            stroke: var(--accent);
            stroke-width: 4;
            stroke-linecap: round;
        }
        .circle {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            background: var(--accent);
            will-change: transform;
            transform: scale(var(--circle-scale));
        }

        /* ─── Session complete screen ────────────────────────────────── */
        #complete-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            background: var(--bg);
            text-align: center;
            padding: 40px 24px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #complete-overlay.visible { display: flex; }
        #complete-overlay.shown { opacity: 1; }
        #complete-title {
            font-size: 2rem;
            font-weight: 500;
            line-height: 1.2;
        }
        #complete-stats {
            font-size: 0.95rem;
            color: var(--muted);
            line-height: 1.8;
        }
        #complete-btn {
            margin-top: 8px;
            padding: 12px 32px;
            font-size: 1rem;
        }

        /* ─── Mobile: controls become a bottom sheet ─────────────────── */
        #sheet-handle { display: none; }
        @media (max-width: 640px) {
            #sheet-handle {
                display: block;
                width: 40px;
                height: 4px;
                background: var(--border);
                border-radius: 2px;
                margin: 0 auto 10px;
            }
            #control-panel {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                max-width: 100%;
                border-width: 1px 0 0;
                border-radius: 16px 16px 0 0;
                margin-bottom: 0;
                padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
                z-index: 50;
            }
            /* Leave room above the fixed panel for the circle */
            #app {
                max-width: 100%;
                min-height: 100vh;
                padding-bottom: 140px;
                justify-content: center;
            }
            /* Settings scroll inside the panel instead of growing it */
            #settings-body {
                max-height: 42vh;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
        }
    </style>
</head>
<body>

<!-- Session complete overlay -->
<div id="complete-overlay" role="dialog" aria-modal="true" aria-labelledby="complete-title">
    <div id="complete-title">Well done.</div>
    <div id="complete-stats"></div>
    <button id="complete-btn">Begin Again</button>
</div>

<div id="app">

    <!-- Control panel / mobile bottom sheet -->
    <div id="control-panel">
        <div id="sheet-handle" aria-hidden="true"></div>
        <div id="panel-header">
            <button id="toggle-settings-btn">Settings ↕</button>
        </div>

        <!-- Mid-session top row: settings reveal + pause -->
        <div id="session-top-row">
            <button id="mini-reveal-btn">⚙ Settings</button>
            <button id="quick-pause-btn">⏸ Pause</button>
            <button id="mini-reset-btn">Reset</button>
        </div>

        <div id="settings-body">
            <div class="settings-section">
                <!-- Pattern selector -->
                <div id="pattern-wrap">
                    <select id="pattern-select">
                        <option value="4-6">Relax (4:6)</option>
                        <option value="5-5">Coherent (5:5)</option>
                        <option value="box">Box (4-4-4-4)</option>
                        <option value="4-7-8">Deep Rest (4-7-8)</option>
                        <option value="4-2-4-2">Balanced (4-2-4-2)</option>
                    </select>
                    <div id="pattern-description"></div>
                </div>

                <!-- Session length -->
                <div class="row">
                    <label class="muted">Session length:</label>
                    <input type="number" id="minutes-input" value="16" min="1" max="60">
                    <span class="muted">min</span>
                </div>
                <div class="row options">
                    <label class="check"><input type="checkbox" id="keep-awake-toggle" checked> Keep screen on</label>
                    <label class="check"><input type="checkbox" id="fade-toggle" checked> Fade out at end</label>
                </div>
            </div>

            <div class="settings-section">
                <div class="row">
                    <select id="sound-select">
                        <option value="chords">Resolving Chords</option>
                        <option value="mute">Mute</option>
                    </select>
                    <select id="theme-select" aria-label="Theme">
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                    </select>
                </div>
                <div class="mixer-row">
                    <div class="mixer-col">
                        <label>Volume</label>
                        <input type="range" id="pacer-vol-slider" min="0" max="1" step="0.01" value="1">
                    </div>
                </div>

            </div>

        </div>

        <div class="btn-row">
            <button id="start-btn">Start</button>
            <button id="pause-btn" disabled>Pause</button>
            <button id="reset-btn">Reset</button>
        </div>

        <div id="timer-display">16:00</div>
    </div><!-- /control-panel -->

    <!-- Instruction text (aria-live for screen readers) -->
    <div id="instruction" aria-live="polite" aria-atomic="true">Ready to breathe</div>
    <div id="phase-countdown"></div>

    <!-- Breathing circle -->
    <div class="pacer-container">
        <svg id="arc-svg" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
            <circle id="arc-track"    cx="130" cy="130" r="122"/>
            <circle id="arc-progress" cx="130" cy="130" r="122"/>
        </svg>
        <div class="circle" id="circle"></div>
    </div>

</div><!-- /app -->

<script>
/* ═══════════════════════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════════════════════ */
const CIRCLE_MIN_SCALE    = 1.0;
const CIRCLE_MAX_SCALE    = 2.5;
const CIRCLE_HOLD_IN_SCALE  = 2.5;   // scale after inhale hold
const CIRCLE_HOLD_OUT_SCALE = 1.0;   // scale after exhale hold
const EASE_POWER          = 2;
const ARC_RADIUS          = 122;
const ARC_CIRCUMFERENCE   = 2 * Math.PI * ARC_RADIUS;
const COMPLETION_HOLD_SEC = 3;       // stillness before overlay
/* ═══════════════════════════════════════════════════════════════
   PATTERN LIBRARY
═══════════════════════════════════════════════════════════════ */
const PATTERNS = {
    '4-6': {
        description: 'Longer exhale activates the parasympathetic system — great for winding down.',
        phases: [
            {type:'inhale', text:'Inhale',   duration:4, freq:523.25},
            {type:'exhale', text:'Exhale',   duration:6, freq:392.00},
        ]
    },
    '5-5': {
        description: 'Equal timing synchronises heart-rate variability — ideal for focus and calm.',
        phases: [
            {type:'inhale', text:'Inhale',   duration:5, freq:523.25},
            {type:'exhale', text:'Exhale',   duration:5, freq:392.00},
        ]
    },
    'box': {
        description: 'Four equal sides ground attention and reduce stress — used by Navy SEALs.',
        phases: [
            {type:'inhale', text:'Inhale',   duration:4, holdScale:CIRCLE_MAX_SCALE,    freq:523.25},
            {type:'hold',   text:'Hold',     duration:4, holdScale:CIRCLE_HOLD_IN_SCALE, freq:329.63},
            {type:'exhale', text:'Exhale',   duration:4, holdScale:CIRCLE_MIN_SCALE,    freq:392.00},
            {type:'hold',   text:'Hold',     duration:4, holdScale:CIRCLE_HOLD_OUT_SCALE,freq:329.63},
        ]
    },
    '4-7-8': {
        description: 'The long hold releases tension — a powerful tool before sleep or anxiety.',
        phases: [
            {type:'inhale', text:'Inhale',   duration:4, freq:523.25},
            {type:'hold',   text:'Hold',     duration:7, holdScale:CIRCLE_HOLD_IN_SCALE, freq:329.63},
            {type:'exhale', text:'Exhale',   duration:8, freq:392.00},
        ]
    },
    '4-2-4-2': {
        description: 'Gentle holds keep rhythm lively — good for morning energy or light meditation.',
        phases: [
            {type:'inhale', text:'Inhale',   duration:4, holdScale:CIRCLE_MAX_SCALE,     freq:523.25},
            {type:'hold',   text:'Hold',     duration:2, holdScale:CIRCLE_HOLD_IN_SCALE,  freq:329.63},
            {type:'exhale', text:'Exhale',   duration:4, holdScale:CIRCLE_MIN_SCALE,     freq:392.00},
            {type:'hold',   text:'Hold',     duration:2, holdScale:CIRCLE_HOLD_OUT_SCALE, freq:329.63},
        ]
    },
};

/* ═══════════════════════════════════════════════════════════════
   SESSION STATE
═══════════════════════════════════════════════════════════════ */
const sessionState = {
    isRunning:          false,
    hasStarted:         false,      // a session is under way (running or paused)
    patternTime:        0,          // seconds into the repeating breathing pattern
    startingMinutes:    16,
    totalTimeRemaining: 16 * 60,
    currentPattern:     PATTERNS['4-6'].phases,
    currentPatternKey:  '4-6',
    lastPhaseIndex:     -1,
    animationFrameId:   null,
    tickTimer:          null,
    breathCount:        0,
    // While running, time is measured on the audio clock. It keeps ticking with the
    // screen off, unlike requestAnimationFrame, which stops as soon as the page is hidden.
    runStartAudio:      0,
    patternTimeAtRun:   0,
    remainingAtRun:     0,
};

/* ═══════════════════════════════════════════════════════════════
   AUDIO STATE
═══════════════════════════════════════════════════════════════ */
let audioCtx        = null;
let pacerSwellGain  = null;
let pacerVolGain    = null;
let reverbNode      = null;   // shared generated-hall reverb (wet bus)
let reverbSend      = null;
let fadeGain        = null;   // slowly lowers the cues over the end of the session
let endBus          = null;   // end-of-session chime (skips the breathing swell)
const activeOscillators = new Set();   // everything queued, so pause/reset can silence it
let wakeLock        = null;
let keepAliveOsc    = null;   // silent oscillator to keep audio alive on lock screen
let keepAliveGain   = null;

/* ═══════════════════════════════════════════════════════════════
   DOM REFS
═══════════════════════════════════════════════════════════════ */
const circle          = document.getElementById('circle');
const instructionEl   = document.getElementById('instruction');
const phaseCountdown  = document.getElementById('phase-countdown');
const timerDisplay    = document.getElementById('timer-display');
const arcProgress     = document.getElementById('arc-progress');

const patternSelect   = document.getElementById('pattern-select');
const patternDesc     = document.getElementById('pattern-description');
const soundSelect     = document.getElementById('sound-select');
const themeSelect     = document.getElementById('theme-select');
const minutesInput    = document.getElementById('minutes-input');
const keepAwakeToggle = document.getElementById('keep-awake-toggle');
const fadeToggle      = document.getElementById('fade-toggle');
const pacerVolSlider  = document.getElementById('pacer-vol-slider');

const startBtn        = document.getElementById('start-btn');
const pauseBtn        = document.getElementById('pause-btn');
const resetBtn        = document.getElementById('reset-btn');
const quickPauseBtn   = document.getElementById('quick-pause-btn');
const toggleSettingsBtn = document.getElementById('toggle-settings-btn');
const miniRevealBtn   = document.getElementById('mini-reveal-btn');
const miniResetBtn    = document.getElementById('mini-reset-btn');
const settingsBody    = document.getElementById('settings-body');

const completeOverlay = document.getElementById('complete-overlay');
const completeStats   = document.getElementById('complete-stats');
const completeBtn     = document.getElementById('complete-btn');

/* Arc init */
arcProgress.style.strokeDasharray  = ARC_CIRCUMFERENCE;
arcProgress.style.strokeDashoffset = ARC_CIRCUMFERENCE;

/* ═══════════════════════════════════════════════════════════════
   SETTINGS PANEL TOGGLE
═══════════════════════════════════════════════════════════════ */
let settingsOpen = true;

function openSettings() {
    settingsOpen = true;
    settingsBody.classList.remove('collapsed');
}
function closeSettings() {
    settingsOpen = false;
    settingsBody.classList.add('collapsed');
}

toggleSettingsBtn.addEventListener('click', () => {
    settingsOpen ? closeSettings() : openSettings();
});
miniRevealBtn.addEventListener('click', () => {
    openSettings();
});

/* ═══════════════════════════════════════════════════════════════
   QUICK PAUSE BUTTON (visible during session without settings)
═══════════════════════════════════════════════════════════════ */
function updateQuickPauseBtn() {
    if (sessionState.isRunning) {
        quickPauseBtn.textContent = '⏸ Pause';
        quickPauseBtn.classList.remove('is-paused');
    } else {
        quickPauseBtn.textContent = '▶ Resume';
        quickPauseBtn.classList.add('is-paused');
    }
}

quickPauseBtn.addEventListener('click', () => {
    if (sessionState.isRunning) {
        pauseSession();
    } else {
        startSession();
    }
    updateQuickPauseBtn();
});

/* ═══════════════════════════════════════════════════════════════
   PATTERN DESCRIPTIONS
═══════════════════════════════════════════════════════════════ */
function updatePatternDescription(key) {
    if (PATTERNS[key]) {
        patternDesc.textContent = PATTERNS[key].description;
    } else {
        patternDesc.textContent = 'Set your own timing below.';
    }
}
updatePatternDescription('4-6');

/* ═══════════════════════════════════════════════════════════════
   WAKE LOCK
═══════════════════════════════════════════════════════════════ */
// Inside the Android app, a small native plugin keeps the screen on.
// In a normal browser we use the standard Screen Wake Lock API instead.
/* ═══════════════════════════════════════════════════════════════
   THEME (light / dark)
═══════════════════════════════════════════════════════════════ */
// In the Android app, a small native plugin also colours the area behind the status and navigation bars.
const NativeTheme = (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
                     && window.Capacitor.Plugins && window.Capacitor.Plugins.AppTheme) || null;

function applyTheme(theme, save) {
    document.documentElement.setAttribute('data-theme', theme);
    themeSelect.value = theme;
    document.getElementById('meta-theme').setAttribute('content', theme === 'dark' ? '#000000' : '#ffffff');
    if (NativeTheme) NativeTheme.set({ dark: theme === 'dark' }).catch(() => {});
    if (save) { try { localStorage.setItem('zenPacerTheme', theme); } catch (e) {} }
}
themeSelect.addEventListener('change', () => applyTheme(themeSelect.value, true));

// "Keep screen on" can be flipped at any time, including mid-session
keepAwakeToggle.addEventListener('change', () => {
    if (!sessionState.isRunning) return;
    if (keepAwakeToggle.checked) requestWakeLock(); else releaseWakeLock();
});
applyTheme(document.documentElement.getAttribute('data-theme'), false);

// Inside the Android app, a foreground service (with a small notification) keeps the app
// alive so the breathing audio carries on with the screen off or the app in the background.
const NativeBackground = (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
                          && window.Capacitor.Plugins && window.Capacitor.Plugins.BackgroundSession) || null;
function startBackground() { if (NativeBackground) NativeBackground.start().catch(e => console.log('Background:', e)); }
function pausedBackground() { if (NativeBackground) NativeBackground.paused().catch(() => {}); }
function stopBackground()  { if (NativeBackground) NativeBackground.stop().catch(() => {}); }

// The notification's Pause/Resume and Stop buttons (also shown on the lock screen) come back as events
if (NativeBackground) {
    window.Capacitor.addListener('BackgroundSession', 'toggle', () => {
        if (!sessionState.hasStarted) return;
        if (sessionState.isRunning) pauseSession(); else startSession();
        updateQuickPauseBtn();
    });
    window.Capacitor.addListener('BackgroundSession', 'stop', () => resetSession());
}

const NativeKeepAwake = (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
                         && window.Capacitor.Plugins && window.Capacitor.Plugins.KeepAwake) || null;

async function requestWakeLock() {
    if (!keepAwakeToggle.checked) return;       // "Keep screen on" is switched off
    if (NativeKeepAwake) {
        NativeKeepAwake.enable().catch(e => console.log('Keep awake:', e));
        return;
    }
    try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) { console.log('Wake lock:', e); }
}
function releaseWakeLock() {
    if (NativeKeepAwake) NativeKeepAwake.disable().catch(() => {});
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
}

/* ═══════════════════════════════════════════════════════════════
   AUDIO — keep-alive for Android lock screen
═══════════════════════════════════════════════════════════════ */
function startKeepAlive() {
    if (keepAliveOsc || !audioCtx) return;
    keepAliveOsc  = audioCtx.createOscillator();
    keepAliveGain = audioCtx.createGain();
    keepAliveGain.gain.value = 0.0001; // essentially silent but keeps context alive
    keepAliveOsc.frequency.value = 1;  // 1 Hz, completely inaudible
    keepAliveOsc.connect(keepAliveGain);
    keepAliveGain.connect(audioCtx.destination);
    keepAliveOsc.start();
}

function stopKeepAlive() {
    if (keepAliveOsc) {
        try { keepAliveOsc.stop(); } catch(e) {}
        keepAliveOsc.disconnect();
        keepAliveOsc  = null;
        keepAliveGain = null;
    }
}

function setupMediaSession() {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
        title: 'Breathing is Beautiful',
        artist: 'Breathing Session',
        album: 'Zen Pacer',
    });
    navigator.mediaSession.setActionHandler('play',  () => { startSession(); updateQuickPauseBtn(); });
    navigator.mediaSession.setActionHandler('pause', () => { pauseSession(); updateQuickPauseBtn(); });
    navigator.mediaSession.playbackState = 'playing';
}

function updateMediaSession(state) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.playbackState = state; // 'playing' | 'paused'
}

/* ═══════════════════════════════════════════════════════════════
   AUDIO
═══════════════════════════════════════════════════════════════ */
/* Generated stereo impulse response — exponentially decaying noise.
   Gives every tone a soft, natural room around it. */
function buildImpulse(duration, decay) {
    const rate = audioCtx.sampleRate;
    const len  = Math.floor(rate * duration);
    const buf  = audioCtx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) {
            d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
        }
    }
    return buf;
}

/* A "voice" = two gently detuned oscillators (chorus-like warmth).
   Returns the oscillators so callers can attach vibrato LFOs. */
function trackOscillator(o) {
    activeOscillators.add(o);
    o.onended = () => activeOscillators.delete(o);
}

function makeVoice(freq, dest, when, stopAt, type = 'sine', detune = 4) {
    const oscs = [];
    [-detune, detune].forEach(cents => {
        const o = audioCtx.createOscillator();
        o.type = type;
        o.frequency.value = freq;
        o.detune.value = cents;
        o.connect(dest);
        o.start(when);
        o.stop(stopAt);
        trackOscillator(o);
        oscs.push(o);
    });
    return oscs;
}

function initAudio() {
    if (!audioCtx) {
        // 'playback' = large audio buffers: fewer dropouts/clicks (nothing here needs low latency)
        audioCtx       = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
        pacerSwellGain = audioCtx.createGain();
        pacerVolGain   = audioCtx.createGain();
        pacerVolGain.gain.value = parseFloat(pacerVolSlider.value);
        fadeGain = audioCtx.createGain();
        pacerSwellGain.connect(fadeGain);
        fadeGain.connect(pacerVolGain);
        pacerVolGain.connect(audioCtx.destination);

        // Reverb wet bus: pacer voices send into a generated hall,
        // blended back in under the pacer volume control.
        reverbNode = audioCtx.createConvolver();
        reverbNode.buffer = buildImpulse(2.2, 2.4);
        reverbSend = audioCtx.createGain();
        reverbSend.gain.value = 0.5;
        fadeGain.connect(reverbNode);
        reverbNode.connect(reverbSend);
        reverbSend.connect(pacerVolGain);

        endBus = audioCtx.createGain();
        endBus.connect(pacerVolGain);
        endBus.connect(reverbNode);
    }
    // Android Chrome suspends the context on screen-lock; always attempt resume
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}

pacerVolSlider.addEventListener('input', e => { if (pacerVolGain) pacerVolGain.gain.setTargetAtTime(e.target.value, audioCtx.currentTime, 0.1); });

/* Soft swell envelope with monotonic, clamped timings — safe even for
   very short phases. */
function applySwell(gainParam, t0, tEnd, peak, attack) {
    const atk = Math.min(attack, (tEnd - t0) * 0.5);
    gainParam.setValueAtTime(0.0001, t0);
    gainParam.exponentialRampToValueAtTime(peak, t0 + atk);
    gainParam.setValueAtTime(peak, Math.max(t0 + atk, tEnd - atk));
    gainParam.exponentialRampToValueAtTime(0.0001, tEnd);
}

/* Very slow pitch shimmer (±cents) attached to a set of oscillators */
function attachVibrato(oscs, when, stopAt, cents = 2.5) {
    const lfo = audioCtx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.13 + Math.random() * 0.1;
    const depth = audioCtx.createGain();
    depth.gain.value = cents;
    lfo.connect(depth);
    oscs.forEach(o => depth.connect(o.detune));
    lfo.start(when);
    lfo.stop(stopAt);
    trackOscillator(lfo);
}

/* A one-off chord built from short-lived nodes: used for the closing breath only. */
function playChordOnce(phaseType, when, duration, dest) {
    if (soundSelect.value === 'mute' || !audioCtx) return;

    const gap = 0.15;
    const end = when + duration - gap;

    const freqs = phaseType === 'inhale'
        ? [174.61, 261.63, 349.23, 440.00]
        : phaseType === 'exhale'
        ? [130.81, 196.00, 261.63, 329.63]
        : [196.00, 293.66, 392.00, 493.88];
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 1800; filter.Q.value = 0.3;
    filter.connect(dest);
    // Notes bloom one after another, like fingers settling on strings
    freqs.forEach((f, i) => {
        const t0 = when + i * 0.22;
        if (t0 >= end - 0.3) return;
        const g = audioCtx.createGain();
        const peak = (CUE_LEVEL / freqs.length) * (1 - i * 0.08);
        applySwell(g.gain, t0, end, peak, 1.2);
        g.connect(filter);
        const oscs = makeVoice(f, g, t0, end, 'sine', 3);
        attachVibrato(oscs, t0, end, 1.8);
    });
}

function playCompletionTone(when) {
    const now = when === undefined ? audioCtx.currentTime : when;
    const freqs = [261.63, 329.63, 392.00, 523.25];
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.12, now + 0.6);
    gain.gain.setValueAtTime(0.12, now + 2.5);
    gain.gain.linearRampToValueAtTime(0, now + 4);
    gain.connect(audioCtx.destination);
    freqs.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine'; osc.frequency.value = f;
        osc.connect(gain);
        osc.start(now + i * 0.08);
        osc.stop(now + 4);
    });
}

/* ═══════════════════════════════════════════════════════════════
   THE BREATHING VOICES
   Four notes that are built once per session and then only retuned and re-shaped
   (via scheduled changes) for each cue. Creating and discarding a fresh set of audio
   objects for every cue made the audio engine do constant extra work, which showed up
   as clicks on a phone.
═══════════════════════════════════════════════════════════════ */
// Level of each note. Four notes (two oscillators each) can line up and add together, so this
// leaves headroom: at full volume the sum must stay clear of 1.0 or the sound clips (clicks).
const CUE_LEVEL = 0.41;

const NOTE_FREQS = {
    inhale: [174.61, 261.63, 349.23, 440.00],
    exhale: [130.81, 196.00, 261.63, 329.63],
    hold:   [196.00, 293.66, 392.00, 493.88],
};
let voices      = null;   // [{ gain, oscs: [two detuned sines], lfo, depth }] x 4
let voiceFilter = null;

function buildVoices() {
    if (voices || !audioCtx) return;
    voiceFilter = audioCtx.createBiquadFilter();
    voiceFilter.type = 'lowpass'; voiceFilter.frequency.value = 1800; voiceFilter.Q.value = 0.3;
    voiceFilter.connect(pacerSwellGain);
    const now = audioCtx.currentTime;
    voices = [0, 1, 2, 3].map(() => {
        const gain = audioCtx.createGain();
        gain.gain.value = 0;
        gain.connect(voiceFilter);
        // very slow pitch shimmer shared by the voice's two oscillators
        const lfo   = audioCtx.createOscillator();
        lfo.type = 'sine'; lfo.frequency.value = 0.13 + Math.random() * 0.1;
        const depth = audioCtx.createGain();
        depth.gain.value = 1.8;
        lfo.connect(depth);
        const oscs = [-3, 3].map(cents => {
            const o = audioCtx.createOscillator();
            o.type = 'sine'; o.frequency.value = 220; o.detune.value = cents;
            depth.connect(o.detune);
            o.connect(gain);
            o.start(now);
            return o;
        });
        lfo.start(now);
        return { gain, oscs, lfo, depth };
    });
}

function teardownVoices(fadeSec) {
    if (!voices) return;
    const t = audioCtx.currentTime;
    const filter = voiceFilter;
    voices.forEach(v => {
        v.gain.gain.cancelScheduledValues(t);
        v.gain.gain.setTargetAtTime(0, t, 0.05);
        [...v.oscs, v.lfo].forEach(o => { try { o.stop(t + fadeSec); } catch (e) {} });
    });
    setTimeout(() => { try { filter.disconnect(); } catch (e) {} }, fadeSec * 1000 + 300);
    voices = null; voiceFilter = null;
}

/* One breathing cue: a soft chord that blooms note by note. `when` is on the audio clock. */
function playPhaseVoices(phaseType, when, duration) {
    if (!voices) return;
    const gap   = 0.15;
    const end   = when + duration - gap;
    const freqs = NOTE_FREQS[phaseType] || NOTE_FREQS.hold;
    voices.forEach((v, i) => {
        const t0 = when + i * 0.22;
        if (t0 >= end - 0.3) return;                       // phase too short for this note
        // Retune while the voice is silent (the previous cue ended at least `gap` seconds ago)
        v.oscs.forEach(o => o.frequency.setValueAtTime(freqs[i], when - 0.05));
        const peak = (CUE_LEVEL / freqs.length) * (1 - i * 0.08);
        applySwell(v.gain.gain, t0, end, peak, 1.2);
    });
}

/* ═══════════════════════════════════════════════════════════════
   QUEUEING THE SESSION'S AUDIO AHEAD OF TIME
   Notes are queued on the audio clock a few minutes in advance and topped up
   every second. The audio thread plays them even when the screen is off and
   the page is hidden, when timers and animation frames are throttled or paused.
═══════════════════════════════════════════════════════════════ */
const SCHEDULE_AHEAD_SEC = 240;
let scheduleAheadSec = SCHEDULE_AHEAD_SEC;
const queue = { phaseIndex: 0, phaseTime: 0, endTime: 0, endQueued: false, phasesQueued: 0 };

// Which phase of the repeating pattern is at `patternTime`, and how far into it we are.
function phaseAt(patternTime) {
    const phases = sessionState.currentPattern;
    const cycle  = phases.reduce((s, p) => s + p.duration, 0);
    const t = patternTime % cycle;
    let acc = 0;
    for (let i = 0; i < phases.length; i++) {
        if (t < acc + phases[i].duration) return { index: i, offset: t - acc, cycle };
        acc += phases[i].duration;
    }
    return { index: 0, offset: 0, cycle };
}

function queuePhase(phase, when) {
    if (soundSelect.value === 'mute') return;
    // Volume swell: rises through an inhale, falls through an exhale, steady on holds
    let from, to;
    if (phase.type === 'inhale')      { from = 0.15; to = 1.0; }
    else if (phase.type === 'exhale') { from = 1.0;  to = 0.15; }
    else { from = to = (phase.holdScale === CIRCLE_HOLD_IN_SCALE ? 1.0 : 0.15); }
    const swell = pacerSwellGain.gain;
    swell.setValueAtTime(from, when);
    swell.linearRampToValueAtTime(to, when + phase.duration);
    playPhaseVoices(phase.type, when, phase.duration);
}

function queueEnd(when) {
    queue.endQueued = true;
    playChordOnce('inhale', when, 3, endBus);                       // soft closing breath
    playCompletionTone(when + COMPLETION_HOLD_SEC);             // then the chime
}

function scheduleAudio() {
    if (!sessionState.isRunning || !audioCtx) return;
    const now     = audioCtx.currentTime;
    const horizon = now + scheduleAheadSec;
    const phases  = sessionState.currentPattern;
    while (queue.phaseTime < horizon && queue.phaseTime < queue.endTime) {
        const phase = phases[queue.phaseIndex];
        // If we've fallen well behind, skip silently rather than playing a burst of old notes
        if (queue.phaseTime >= now - 0.3) queuePhase(phase, Math.max(queue.phaseTime, now));
        queue.phaseTime += phase.duration;
        queue.phaseIndex = (queue.phaseIndex + 1) % phases.length;
        queue.phasesQueued++;
    }
    if (!queue.endQueued && queue.endTime < horizon) queueEnd(queue.endTime);
}

// Fade the cues down over the last minute (half of a very short session) so the session ends softly.
// The closing breath and chime come after the fade.
function applyFade() {
    if (!fadeGain || !audioCtx) return;
    const now = audioCtx.currentTime;
    const g = fadeGain.gain;
    g.cancelScheduledValues(now);
    const floor = 0.15;
    const fadeSec = Math.min(60, sessionState.startingMinutes * 30);
    const fadeStart = queue.endTime - fadeSec;
    if (!fadeToggle.checked || !sessionState.isRunning || now >= queue.endTime) {
        g.setValueAtTime(1, now);
    } else if (now >= fadeStart) {
        // resumed partway through the fade
        g.setValueAtTime(1 - (1 - floor) * ((now - fadeStart) / fadeSec), now);
        g.linearRampToValueAtTime(floor, queue.endTime);
    } else {
        g.setValueAtTime(1, now);
        g.setValueAtTime(1, fadeStart);
        g.linearRampToValueAtTime(floor, queue.endTime);
    }
}
fadeToggle.addEventListener('change', () => { if (sessionState.isRunning) applyFade(); });

// Pause / reset: fade out and drop everything that was queued.
function cancelQueuedAudio() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    pacerSwellGain.gain.cancelScheduledValues(t);
    pacerSwellGain.gain.setTargetAtTime(0, t, 0.08);
    activeOscillators.forEach(o => { try { o.stop(t + 0.5); } catch (e) {} });
    activeOscillators.clear();
    teardownVoices(0.5);
}

// Test hook: lets the emulator test see that queueing carries on with the screen off
window.zenDebug = {
    get phasesQueued() { return queue.phasesQueued; },
    get audioState() { return audioCtx ? audioCtx.state : 'none'; },
    get fade() { return fadeGain ? fadeGain.gain.value : null; },
    get remaining() { syncClock(); return sessionState.totalTimeRemaining; },
    setAheadSeconds(sec) { scheduleAheadSec = sec; },
};

/* ═══════════════════════════════════════════════════════════════
   UTILITY
═══════════════════════════════════════════════════════════════ */
function easeInOut(t) { return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t; }

function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2,'0')}`;
}


/* ═══════════════════════════════════════════════════════════════
   SESSION CLOCK + DRAWING
═══════════════════════════════════════════════════════════════ */
function syncClock() {
    if (!sessionState.isRunning) return;
    const elapsed = Math.max(0, audioCtx.currentTime - sessionState.runStartAudio);
    sessionState.patternTime        = sessionState.patternTimeAtRun + elapsed;
    sessionState.totalTimeRemaining = sessionState.remainingAtRun - elapsed;
}

// Runs every animation frame while the screen is on AND once a second from a timer,
// so the session keeps counting, queueing audio and finishing with the screen off.
function tick() {
    if (!sessionState.isRunning) return;
    syncClock();
    if (sessionState.totalTimeRemaining <= 0) { finishSession(); return; }
    scheduleAudio();
}

function render() {
    timerDisplay.textContent = formatTime(sessionState.totalTimeRemaining);

    const phases = sessionState.currentPattern;
    const at     = phaseAt(sessionState.patternTime);
    const phase  = phases[at.index];

    if (at.index !== sessionState.lastPhaseIndex) {
        instructionEl.textContent = phase.text;
        sessionState.lastPhaseIndex = at.index;
    }

    const progress = at.offset / phase.duration;
    const eased    = easeInOut(progress);

    // Circle scale
    let scale = CIRCLE_MIN_SCALE;
    if (phase.type === 'inhale') {
        scale = CIRCLE_MIN_SCALE + (CIRCLE_MAX_SCALE - CIRCLE_MIN_SCALE) * eased;
    } else if (phase.type === 'exhale') {
        scale = CIRCLE_MAX_SCALE - (CIRCLE_MAX_SCALE - CIRCLE_MIN_SCALE) * eased;
    } else {
        scale = phase.holdScale !== undefined ? phase.holdScale : CIRCLE_MIN_SCALE;
    }
    setCircleScale(scale);

    // Progress ring: depletes over the phase
    arcProgress.style.strokeDashoffset = ARC_CIRCUMFERENCE * progress;

    // Phase countdown (ceiling so "5" shows for a full second)
    const secsLeft = Math.ceil(phase.duration * (1 - progress));
    phaseCountdown.textContent = secsLeft > 0 ? secsLeft : '';
}

function loop() {
    tick();
    if (sessionState.isRunning) {
        render();
        sessionState.animationFrameId = requestAnimationFrame(loop);
    }
}

function stopSessionTimers() {
    clearInterval(sessionState.tickTimer);
    sessionState.tickTimer = null;
    cancelAnimationFrame(sessionState.animationFrameId);
}

function finishSession() {
    sessionState.totalTimeRemaining = 0;
    sessionState.isRunning = false;
    stopSessionTimers();
    if (!queue.endQueued) queueEnd(Math.max(queue.endTime, audioCtx.currentTime));
    sessionState.breathCount = Math.round(sessionState.startingMinutes * 60 / phaseAt(0).cycle);
    releaseWakeLock();
    updateMediaSession('none');
    setCircleScale(1);
    arcProgress.style.strokeDashoffset = ARC_CIRCUMFERENCE;
    timerDisplay.textContent   = formatTime(0);
    instructionEl.textContent  = '';
    phaseCountdown.textContent = '';
    showCompleteOverlay();
    // Keep the background service and silent keep-alive until the closing chime has finished
    setTimeout(() => { if (!sessionState.isRunning) { stopKeepAlive(); stopBackground(); } },
               (COMPLETION_HOLD_SEC + 6) * 1000);
}

function setCircleScale(s) {
    document.documentElement.style.setProperty('--circle-scale', s);
    circle.style.transform = `scale(${s})`;
}

/* ═══════════════════════════════════════════════════════════════
   SESSION COMPLETE OVERLAY
═══════════════════════════════════════════════════════════════ */
function showCompleteOverlay() {
    // A few seconds of stillness first
    setTimeout(() => {
        const patternLabel = patternSelect.options[patternSelect.selectedIndex].text;

        const totalMins   = Math.round(sessionState.startingMinutes);
        const breaths     = sessionState.breathCount;

        completeStats.innerHTML =
            `<strong>${totalMins} min</strong> of ${patternLabel}<br>` +
            `~${breaths} breath cycles completed`;

        completeOverlay.classList.add('visible');
        requestAnimationFrame(() => {
            requestAnimationFrame(() => completeOverlay.classList.add('shown'));
        });

        setUiState('idle');
        document.body.classList.remove('session-active');

    }, COMPLETION_HOLD_SEC * 1000);
}

completeBtn.addEventListener('click', () => {
    completeOverlay.classList.remove('shown');
    setTimeout(() => completeOverlay.classList.remove('visible'), 600);
    resetSession();
});

/* ═══════════════════════════════════════════════════════════════
   UI STATE HELPERS
═══════════════════════════════════════════════════════════════ */
function setUiState(state) {
    // state: 'idle' | 'running' | 'paused'
    if (state === 'running') {
        startBtn.disabled  = true;
        pauseBtn.disabled  = false;
        patternSelect.disabled = true;
        soundSelect.disabled   = true;
        minutesInput.disabled  = true;
    } else {
        startBtn.disabled  = false;
        pauseBtn.disabled  = true;
        patternSelect.disabled = false;
        soundSelect.disabled   = false;
        minutesInput.disabled  = false;
    }
}

/* ═══════════════════════════════════════════════════════════════
   SESSION CONTROLS
═══════════════════════════════════════════════════════════════ */
function startSession() {
    if (sessionState.isRunning) return;

    initAudio();
    requestWakeLock();
    setupMediaSession();
    startKeepAlive();
    startBackground();

    if (!sessionState.hasStarted) {
        sessionState.hasStarted         = true;
        sessionState.startingMinutes    = parseInt(minutesInput.value) || 16;
        sessionState.totalTimeRemaining = sessionState.startingMinutes * 60;
        sessionState.patternTime        = 0;
    } else {
        // Resuming: begin again from the start of the phase we paused in
        const at = phaseAt(sessionState.patternTime);
        sessionState.patternTime -= at.offset;
    }

    sessionState.isRunning = true;
    sessionState.lastPhaseIndex = -1;
    setUiState('running');

    // Collapse settings, show session top row
    closeSettings();
    document.body.classList.add('session-active');
    updateQuickPauseBtn();

    // Unlock audio context (iOS)
    const unlock = audioCtx.createOscillator();
    const ug = audioCtx.createGain(); ug.gain.value = 0;
    unlock.connect(ug); ug.connect(pacerSwellGain);
    unlock.start(); unlock.stop(audioCtx.currentTime + 0.1);

    // Set the session clock and queue the first stretch of audio
    const now = audioCtx.currentTime;
    sessionState.runStartAudio    = now + 0.15;
    sessionState.patternTimeAtRun = sessionState.patternTime;
    sessionState.remainingAtRun   = sessionState.totalTimeRemaining;
    pacerSwellGain.gain.cancelScheduledValues(now);
    pacerSwellGain.gain.setValueAtTime(0, now);
    queue.phaseIndex   = phaseAt(sessionState.patternTime).index;
    queue.phaseTime    = sessionState.runStartAudio;
    queue.endTime      = sessionState.runStartAudio + sessionState.totalTimeRemaining;
    queue.endQueued    = false;
    queue.phasesQueued = 0;
    buildVoices();
    applyFade();
    scheduleAudio();

    updateMediaSession('playing');
    clearInterval(sessionState.tickTimer);
    sessionState.tickTimer = setInterval(tick, 1000);
    sessionState.animationFrameId = requestAnimationFrame(loop);
}

function pauseSession() {
    if (!sessionState.isRunning) return;
    syncClock();
    sessionState.isRunning = false;
    stopSessionTimers();
    cancelQueuedAudio();
    releaseWakeLock();
    pausedBackground();
    setUiState('paused');
    instructionEl.textContent  = 'Paused';
    phaseCountdown.textContent = '';
    timerDisplay.textContent   = formatTime(Math.max(0, sessionState.totalTimeRemaining));
    updateMediaSession('paused');
    updateQuickPauseBtn();
    // Keep keepAlive running so audio context stays warm for resume
}

function resetSession() {
    sessionState.isRunning          = false;
    sessionState.hasStarted         = false;
    sessionState.patternTime        = 0;
    sessionState.lastPhaseIndex     = -1;
    sessionState.breathCount        = 0;
    sessionState.startingMinutes    = parseInt(minutesInput.value) || 16;
    sessionState.totalTimeRemaining = sessionState.startingMinutes * 60;

    stopSessionTimers();
    cancelQueuedAudio();
    releaseWakeLock();
    stopKeepAlive();
    stopBackground();
    updateMediaSession('none');
    setUiState('idle');

    document.body.classList.remove('session-active');
    openSettings();

    setCircleScale(1);
    arcProgress.style.strokeDashoffset = ARC_CIRCUMFERENCE;

    timerDisplay.textContent   = formatTime(sessionState.totalTimeRemaining);
    instructionEl.textContent  = 'Ready to breathe';
    phaseCountdown.textContent = '';
}

startBtn.addEventListener('click', () => { startSession(); updateQuickPauseBtn(); });
pauseBtn.addEventListener('click', () => { pauseSession(); updateQuickPauseBtn(); });
resetBtn.addEventListener('click', resetSession);
miniResetBtn.addEventListener('click', resetSession);

/* ═══════════════════════════════════════════════════════════════
   PATTERN SELECTION
═══════════════════════════════════════════════════════════════ */
patternSelect.addEventListener('change', e => {
    updatePatternDescription(e.target.value);
    sessionState.currentPattern    = PATTERNS[e.target.value].phases;
    sessionState.currentPatternKey = e.target.value;
    resetSession();
});

minutesInput.addEventListener('change', e => {
    let val = parseInt(e.target.value);
    if (val < 1)  val = 1;
    if (val > 60) val = 60;
    e.target.value = val;
    sessionState.startingMinutes    = val;
    sessionState.totalTimeRemaining = val * 60;
    timerDisplay.textContent = formatTime(sessionState.totalTimeRemaining);
});

/* ═══════════════════════════════════════════════════════════════
   PAGE LIFECYCLE — audio resume + wake lock on Android
═══════════════════════════════════════════════════════════════ */

function restoreAudioAndLock() {
    // Resume the AudioContext — Android Chrome suspends it on screen-lock
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    if (sessionState.isRunning) {
        // Wake lock is released automatically when the page hides; re-request it
        requestWakeLock();
        updateMediaSession('playing');
        tick();      // catch the clock up and queue any audio that's due
        render();
    }
}

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        restoreAudioAndLock();
    }
});

// pageshow fires on bfcache restore — another path where Android Chrome
// can leave the AudioContext suspended
window.addEventListener('pageshow', (e) => {
    if (e.persisted) restoreAudioAndLock();
});

/* ═══════════════════════════════════════════════════════════════
   SAVED SETTINGS — pattern, length, sound, volume and the two switches are remembered
═══════════════════════════════════════════════════════════════ */
const SETTINGS_KEY = 'zenPacerSettings';

function saveSettings() {
    try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({
            pattern:      patternSelect.value,
            minutes:      parseInt(minutesInput.value) || 16,
            sound:        soundSelect.value,
            volume:       parseFloat(pacerVolSlider.value),
            keepScreenOn: keepAwakeToggle.checked,
            fadeOut:      fadeToggle.checked,
        }));
    } catch (e) { /* storage blocked: settings just won't be remembered */ }
}

function loadSettings() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(SETTINGS_KEY)); } catch (e) {}
    if (!saved || typeof saved !== 'object') return;

    if (PATTERNS[saved.pattern]) {
        patternSelect.value = saved.pattern;
        sessionState.currentPattern    = PATTERNS[saved.pattern].phases;
        sessionState.currentPatternKey = saved.pattern;
        updatePatternDescription(saved.pattern);
    }
    const minutes = parseInt(saved.minutes);
    if (minutes >= 1 && minutes <= 60) {
        minutesInput.value = minutes;
        sessionState.startingMinutes    = minutes;
        sessionState.totalTimeRemaining = minutes * 60;
    }
    if (saved.sound === 'chords' || saved.sound === 'mute') soundSelect.value = saved.sound;
    const volume = parseFloat(saved.volume);
    if (volume >= 0 && volume <= 1) pacerVolSlider.value = volume;
    if (typeof saved.keepScreenOn === 'boolean') keepAwakeToggle.checked = saved.keepScreenOn;
    if (typeof saved.fadeOut === 'boolean')      fadeToggle.checked      = saved.fadeOut;
}

// 'change' fires after the other handlers above have tidied the value (e.g. clamped the minutes)
[patternSelect, minutesInput, soundSelect, pacerVolSlider, keepAwakeToggle, fadeToggle]
    .forEach(el => el.addEventListener('change', saveSettings));

/* ═══════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════ */
loadSettings();
timerDisplay.textContent = formatTime(sessionState.totalTimeRemaining);
</script>

<script>
    // The Android app bundles every file, so it doesn't need the offline cache.
    // Only the website / installed-PWA version registers the service worker.
    if ('serviceWorker' in navigator && !window.Capacitor) {
        navigator.serviceWorker.register('sw.js')
            .then(() => console.log('SW registered'));
    }
</script>
