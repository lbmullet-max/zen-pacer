<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121c14" id="meta-theme">
    <title>Breathing is Beautiful</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* ─── Reset & Base ────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-dark: #0e1710;
            --bg-mid:  #121c14;
            --bg-radial: #1b2e1e;
            --text-primary: #dce8df;
            --text-muted: #7a9882;
            --glass-bg: rgba(255,255,255,0.03);
            --glass-border: rgba(255,255,255,0.08);

            /* Phase colour tokens — updated by JS */
            --phase-hue: 150;
            --phase-sat: 40%;
            --phase-light: 55%;
            --phase-color: hsl(var(--phase-hue), var(--phase-sat), var(--phase-light));
            --phase-glow:  hsla(var(--phase-hue), var(--phase-sat), var(--phase-light), 0.35);

            --circle-scale: 1;
            --ring-progress: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-primary);
            font-family: 'DM Sans', system-ui, sans-serif;
            background: radial-gradient(ellipse at 50% 40%, var(--bg-radial) 0%, var(--bg-dark) 70%);
            transition: background 1.8s ease;
            overflow-y: auto;
            overscroll-behavior-y: none;
            position: relative;
        }

        /* ─── Background radial glow ──────────────────────────────────── */
        #bg-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(
                ellipse 60% 50% at 50% 55%,
                var(--phase-glow) 0%,
                transparent 70%
            );
            transition: background 1.5s ease;
            opacity: 0;
            transition: opacity 1.2s ease, background 1.8s ease;
        }
        body.session-active #bg-glow {
            opacity: 1;
        }

        /* ─── Layout wrapper ─────────────────────────────────────────── */
        #app {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 460px;
            padding: 16px 16px 24px;
            gap: 0;
            position: relative;
            z-index: 1;
        }

        /* ─── Glass control panel ────────────────────────────────────── */
        #control-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 18px 20px;
            width: 100%;
            margin-bottom: 20px;
        }

        /* Header row: title + toggle */
        #panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
        }

        #panel-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1rem;
            color: var(--text-primary);
            opacity: 0.85;
            letter-spacing: 0.5px;
            line-height: 1.25;
        }

        #app-title {
            font-family: 'DM Serif Display', serif;
            font-size: 0.88rem;
            color: var(--text-primary);
            opacity: 0.5;
            letter-spacing: 0.5px;
            text-align: center;
            margin-bottom: 2px;
            transition: opacity 0.6s ease;
        }
        body.session-active #app-title {
            opacity: 0;
            pointer-events: none;
            margin-bottom: 0;
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.6s ease, max-height 0.4s ease, margin-bottom 0.4s ease;
        }
        #app-title em {
            font-style: italic;
            color: var(--phase-color);
            opacity: 1;
            transition: color 1.2s ease;
        }

        /* Collapsed state: only show mini-open button */
        #mini-reveal-btn {
            display: none;
            background: transparent;
            border: 1px solid rgba(139,169,151,0.25);
            color: var(--text-muted);
            font-size: 0.78rem;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: opacity 0.2s, border-color 0.2s;
            white-space: nowrap;
        }
        #mini-reveal-btn:hover { border-color: rgba(139,169,151,0.55); }

        body.session-active #panel-header { display: none; }
        body.session-active #mini-reveal-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 0;
        }

        /* ─── Session quick controls (pause visible mid-session) ─────── */
        #session-quick-controls {
            display: none;
            gap: 8px;
            width: 100%;
            margin-bottom: 4px;
        }
        body.session-active #session-quick-controls {
            display: flex;
            align-items: center;
        }
        #session-top-row {
            display: none;
            gap: 8px;
            width: 100%;
            margin-bottom: 4px;
            align-items: center;
        }
        body.session-active #session-top-row {
            display: flex;
        }
        #quick-pause-btn {
            flex: 1;
            background: rgba(255,255,255,0.08);
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.12);
            font-size: 0.85rem;
            padding: 7px 14px;
            border-radius: 20px;
            font-weight: 400;
        }
        #quick-pause-btn.is-paused {
            background: rgba(74,122,90,0.25);
            color: var(--text-primary);
            border-color: rgba(74,122,90,0.4);
        }

        /* The collapsible settings body */
        #settings-body {
            overflow: hidden;
            max-height: 600px;
            transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.35s ease,
                        margin-top 0.35s ease;
            margin-top: 16px;
            opacity: 1;
        }
        #settings-body.collapsed {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }

        .settings-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            margin-bottom: 16px;
        }
        .settings-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
        }

        /* Pattern select with description */
        #pattern-wrap { width: 100%; }
        #pattern-select {
            width: 100%;
        }
        #pattern-description {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 6px;
            min-height: 1.1em;
            font-style: italic;
            letter-spacing: 0.2px;
        }

        /* Styled form controls */
        select, input[type="number"] {
            background: rgba(0,0,0,0.25);
            color: var(--text-primary);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            flex-grow: 1;
            transition: border-color 0.2s;
        }
        select:focus, input[type="number"]:focus {
            border-color: rgba(123,169,139,0.45);
        }
        input[type="number"] {
            width: 64px;
            text-align: center;
            flex-grow: 0;
        }
        select option { background: #1a2e1e; }

        .mixer-row {
            display: flex;
            gap: 16px;
            width: 100%;
        }
        .mixer-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            font-size: 0.8rem;
            color: var(--text-muted);
            flex: 1;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #7ba98b;
            cursor: pointer;
        }

        /* ─── Haptic toggle switch ───────────────────────────────────── */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .toggle-label {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 42px;
            height: 24px;
            flex-shrink: 0;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: rgba(255,255,255,0.1);
            border-radius: 24px;
            transition: background 0.25s;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            left: 2px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--text-muted);
            border-radius: 50%;
            transition: transform 0.25s, background 0.25s;
        }
        .toggle-switch input:checked + .toggle-slider {
            background: rgba(74,122,90,0.55);
            border-color: rgba(74,122,90,0.4);
        }
        .toggle-switch input:checked + .toggle-slider::before {
            transform: translate(18px, -50%);
            background: #7ba98b;
        }

        /* ─── Action buttons ─────────────────────────────────────────── */
        .btn-row {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.07);
        }
        body.session-active .btn-row {
            display: none;
        }
        button {
            padding: 10px 22px;
            font-size: 0.95rem;
            font-family: 'DM Sans', sans-serif;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: transform 0.1s, opacity 0.2s, background 0.2s;
            background: #4a7a5a;
            color: #e8f5ed;
        }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        #pause-btn { background: rgba(255,255,255,0.08); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.12); }
        #reset-btn  { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); }

        /* ─── Timer & stats ──────────────────────────────────────────── */
        #timer-display {
            font-size: 2.6rem;
            font-weight: 300;
            letter-spacing: 3px;
            margin-top: 6px;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
            font-family: 'DM Serif Display', serif;
        }
        /* ─── Instruction label ──────────────────────────────────────── */
        #instruction {
            font-family: 'DM Serif Display', serif;
            font-size: 1.7rem;
            font-weight: 400;
            margin: 20px 0 8px;
            min-height: 2.2rem;
            letter-spacing: 0.5px;
            text-align: center;
            color: var(--phase-color);
            transition: color 1.2s ease;
        }

        /* Phase countdown inside the ring */
        #phase-countdown {
            font-size: 1.1rem;
            font-weight: 300;
            color: var(--text-muted);
            margin-bottom: 16px;
            letter-spacing: 1px;
            min-height: 1.5rem;
            text-align: center;
            font-variant-numeric: tabular-nums;
            transition: opacity 0.4s;
        }

        /* ─── Breathing circle + SVG arc ring ────────────────────────── */
        .pacer-container {
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            margin-bottom: 10px;
        }

        /* SVG arc sits behind the circle */
        #arc-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform: rotate(-90deg);
            pointer-events: none;
        }

        #arc-track {
            fill: none;
            stroke: rgba(255,255,255,0.06);
            stroke-width: 4;
        }

        #arc-progress {
            fill: none;
            stroke: var(--phase-color);
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke 1.2s ease;
            /* stroke-dasharray set by JS */
        }

        .circle {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            will-change: transform;
            background: radial-gradient(circle at 38% 36%,
                hsl(var(--phase-hue), calc(var(--phase-sat) + 10%), calc(var(--phase-light) + 12%)),
                hsl(var(--phase-hue), var(--phase-sat), calc(var(--phase-light) - 18%))
            );
            box-shadow:
                0 0 40px var(--phase-glow),
                0 0 80px hsla(var(--phase-hue), var(--phase-sat), var(--phase-light), 0.12),
                inset 0 0 24px rgba(255,255,255,0.15);
            transform: scale(var(--circle-scale));
            transition:
                background 1.2s ease,
                box-shadow 1.2s ease,
                transform 0.05s linear;
        }

        /* Hold-phase pulsing ring animation */
        @keyframes holdPulse {
            0%, 100% { box-shadow: 0 0 40px var(--phase-glow), 0 0 80px hsla(var(--phase-hue), var(--phase-sat), var(--phase-light), 0.12), inset 0 0 24px rgba(255,255,255,0.15); }
            50%        { box-shadow: 0 0 65px var(--phase-glow), 0 0 110px hsla(var(--phase-hue), var(--phase-sat), var(--phase-light), 0.22), inset 0 0 28px rgba(255,255,255,0.22); }
        }
        .circle.hold-pulse {
            animation: holdPulse 2s ease-in-out infinite;
        }

        /* ─── Contemplative quote ────────────────────────────────────── */
        #quote-box {
            max-width: 330px;
            text-align: center;
            margin-top: 28px;
            padding: 0 12px;
            opacity: 1;
            transition: opacity 1.4s ease;
        }
        body.session-active #quote-box {
            opacity: 0;
            pointer-events: none;
        }
        #quote-text, #complete-quote-text {
            font-family: 'DM Serif Display', serif;
            font-style: italic;
            font-size: 1.02rem;
            line-height: 1.7;
            color: var(--text-primary);
            opacity: 0.82;
            letter-spacing: 0.2px;
        }
        #quote-author, #complete-quote-author {
            margin-top: 10px;
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        #complete-quote {
            max-width: 320px;
            margin: 0 auto;
        }

        /* ─── Session Complete overlay ──────────────────────────────── */
        #complete-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            background: rgba(10, 20, 12, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            text-align: center;
            padding: 40px 24px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        #complete-overlay.visible {
            display: flex;
        }
        #complete-overlay.shown {
            opacity: 1;
        }

        #complete-title {
            font-family: 'DM Serif Display', serif;
            font-size: 2.2rem;
            color: var(--text-primary);
            line-height: 1.2;
        }
        #complete-subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            max-width: 280px;
            line-height: 1.6;
        }
        #complete-stats {
            font-size: 0.9rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 14px 28px;
            letter-spacing: 0.5px;
            line-height: 1.8;
        }
        #complete-btn {
            margin-top: 8px;
            padding: 13px 36px;
            font-size: 1rem;
            border-radius: 50px;
            background: #4a7a5a;
        }

        /* ─── Sheet drag handle (hidden on desktop) ─────────────────── */
        #sheet-handle {
            display: none;
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.22);
            border-radius: 2px;
            margin: 0 auto 10px;
            flex-shrink: 0;
        }

        /* ─── Safe-area top: nothing clips under Android status bar ─── */
        body {
            padding-top: env(safe-area-inset-top, 0px);
        }

        /* ─── Mobile bottom-sheet layout ─────────────────────────────── */
        @media (max-width: 640px) {
            #sheet-handle { display: block; }

            /* Lift panel out of normal flow so it can't push the circle off-screen */
            #control-panel {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                max-width: 100%;
                border-radius: 20px 20px 0 0;
                margin-bottom: 0;
                padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
                z-index: 50;
            }

            /* Give the circle area clearance above the fixed panel */
            #app {
                max-width: 100%;
                min-height: 100vh;
                padding-bottom: 180px;
                justify-content: center;
            }

            /* Settings body scrolls internally, never grows the viewport */
            #settings-body {
                max-height: 55vh;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
        }
    </style>
</head>
<body>

<div id="bg-glow"></div>

<!-- Session complete overlay -->
<div id="complete-overlay" role="dialog" aria-modal="true" aria-labelledby="complete-title">
    <div id="complete-title">Well done.</div>
    <div id="complete-quote">
        <div id="complete-quote-text"></div>
        <div id="complete-quote-author"></div>
    </div>
    <div id="complete-stats"></div>
    <button id="complete-btn">Begin Again</button>
</div>

<div id="app">

    <!-- Control panel / mobile bottom sheet -->
    <div id="control-panel">
        <div id="sheet-handle" aria-hidden="true"></div>
        <div id="panel-header">
            <button id="toggle-settings-btn" style="background:transparent;border:1px solid rgba(139,169,151,0.25);color:var(--text-muted);font-size:0.8rem;padding:5px 14px;border-radius:20px;font-weight:400;">Settings ↕</button>
        </div>

        <!-- Mid-session top row: settings reveal + pause -->
        <div id="session-top-row">
            <button id="mini-reveal-btn">⚙ Settings</button>
            <button id="quick-pause-btn">⏸ Pause</button>
        </div>

        <div id="settings-body">
            <div class="settings-section">
                <!-- Pattern selector -->
                <div id="pattern-wrap">
                    <select id="pattern-select">
                        <option value="4-6">Relax (4:6)</option>
                        <option value="5-5">Coherent (5:5)</option>
                        <option value="box">Box (4-4-4-4)</option>
                        <option value="4-7-8">Deep Rest (4-7-8)</option>
                        <option value="4-2-4-2">Balanced (4-2-4-2)</option>
                    </select>
                    <div id="pattern-description"></div>
                </div>

                <!-- Session length -->
                <div class="row">
                    <label style="color:var(--text-muted);font-size:0.85rem;white-space:nowrap;">Session length:</label>
                    <input type="number" id="minutes-input" value="16" min="1" max="60">
                    <span style="color:var(--text-muted);font-size:0.85rem;">min</span>
                </div>
            </div>

            <div class="settings-section">
                <div class="row">
                    <select id="sound-select">
                        <option value="chords">Resolving Chords</option>
                        <option value="mute">Mute</option>
                    </select>
                </div>
                <div class="mixer-row">
                    <div class="mixer-col">
                        <label>Volume</label>
                        <input type="range" id="pacer-vol-slider" min="0" max="1" step="0.01" value="1">
                    </div>
                </div>

            </div>

        </div>

        <div class="btn-row">
            <button id="start-btn">Start</button>
            <button id="pause-btn" disabled>Pause</button>
            <button id="reset-btn">Reset</button>
        </div>

        <div id="timer-display">16:00</div>
    </div><!-- /control-panel -->

    <div id="app-title">Breathing is <em>Beautiful</em></div>

    <!-- Instruction text (aria-live for screen readers) -->
    <div id="instruction" aria-live="polite" aria-atomic="true">Ready to breathe</div>
    <div id="phase-countdown"></div>

    <!-- Breathing circle -->
    <div class="pacer-container">
        <svg id="arc-svg" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
            <circle id="arc-track"    cx="130" cy="130" r="122"/>
            <circle id="arc-progress" cx="130" cy="130" r="122"/>
        </svg>
        <div class="circle" id="circle"></div>
    </div>

    <!-- Contemplative quote (visible when not in session) -->
    <div id="quote-box">
        <div id="quote-text"></div>
        <div id="quote-author"></div>
    </div>

</div><!-- /app -->

<script>
/* ═══════════════════════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════════════════════ */
const CIRCLE_MIN_SCALE    = 1.0;
const CIRCLE_MAX_SCALE    = 2.5;
const CIRCLE_HOLD_IN_SCALE  = 2.5;   // scale after inhale hold
const CIRCLE_HOLD_OUT_SCALE = 1.0;   // scale after exhale hold
const EASE_POWER          = 2;
const ARC_RADIUS          = 122;
const ARC_CIRCUMFERENCE   = 2 * Math.PI * ARC_RADIUS;
const COMPLETION_HOLD_SEC = 3;       // stillness before overlay
/* Phase colour palette: [hue, sat%, light%] — one consistent theme
   throughout, forest sage. Colour still shifts per breathing phase. */
const PHASE_COLORS = {
    inhale: { hue: 38,  sat: '65%', light: '60%' },
    hold:   { hue: 200, sat: '30%', light: '62%' },
    exhale: { hue: 155, sat: '42%', light: '52%' },
};

/* ═══════════════════════════════════════════════════════════════
   PATTERN LIBRARY
═══════════════════════════════════════════════════════════════ */
const PATTERNS = {
    '4-6': {
        description: 'Longer exhale activates the parasympathetic system — great for winding down.',
        phases: [
            {type:'inhale', text:'Inhale',   duration:4, freq:523.25},
            {type:'exhale', text:'Exhale',   duration:6, freq:392.00},
        ]
    },
    '5-5': {

function drawQuote() {
    let deck = null;
    try { deck = JSON.parse(localStorage.getItem(QUOTE_DECK_KEY)); } catch (e) {}
    if (!deck || !Array.isArray(deck.order) ||
        deck.order.length !== QUOTES.length || deck.idx >= QUOTES.length) {
        const order = QUOTES.map((_, i) => i);
        for (let i = order.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [order[i], order[j]] = [order[j], order[i]];
        }
        deck = { order, idx: 0 };
    }
    const q = QUOTES[deck.order[deck.idx]];
    deck.idx++;
    try { localStorage.setItem(QUOTE_DECK_KEY, JSON.stringify(deck)); } catch (e) {}
    return q;
}

function startKeepAlive() {
    if (keepAliveOsc || !audioCtx) return;
    keepAliveOsc  = audioCtx.createOscillator();
    keepAliveGain = audioCtx.createGain();
    keepAliveGain.gain.value = 0.0001; // essentially silent but keeps context alive
    keepAliveOsc.frequency.value = 1;  // 1 Hz, completely inaudible
    keepAliveOsc.connect(keepAliveGain);
    keepAliveGain.connect(audioCtx.destination);
    keepAliveOsc.start();
}

function stopKeepAlive() {
    if (keepAliveOsc) {
        try { keepAliveOsc.stop(); } catch(e) {}
        keepAliveOsc.disconnect();
        keepAliveOsc  = null;
        keepAliveGain = null;
    }
}

/* ═══════════════════════════════════════════════════════════════
   AUDIO
═══════════════════════════════════════════════════════════════ */
/* Generated stereo impulse response — exponentially decaying noise.
   Gives every tone a soft, natural room around it. */
function buildImpulse(duration, decay) {
    const rate = audioCtx.sampleRate;
    const len  = Math.floor(rate * duration);
    const buf  = audioCtx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) {
            d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
        }
    }
    return buf;
}

/* A "voice" = two gently detuned oscillators (chorus-like warmth).
   Returns the oscillators so callers can attach vibrato LFOs. */
function makeVoice(freq, dest, when, stopAt, type = 'sine', detune = 4) {
    const oscs = [];
    [-detune, detune].forEach(cents => {
        const o = audioCtx.createOscillator();
        o.type = type;
        o.frequency.value = freq;
        o.detune.value = cents;
        o.connect(dest);
        o.start(when);
        o.stop(stopAt);
        oscs.push(o);
    });
    return oscs;
}

function initAudio() {
    if (!audioCtx) {
        audioCtx       = new (window.AudioContext || window.webkitAudioContext)();
        pacerSwellGain = audioCtx.createGain();
        pacerVolGain   = audioCtx.createGain();
        pacerVolGain.gain.value = parseFloat(pacerVolSlider.value);
        pacerSwellGain.connect(pacerVolGain);
        pacerVolGain.connect(audioCtx.destination);

        // Reverb wet bus: pacer voices send into a generated hall,
        // blended back in under the pacer volume control.
        reverbNode = audioCtx.createConvolver();
        reverbNode.buffer = buildImpulse(3.2, 2.4);
        reverbSend = audioCtx.createGain();
        reverbSend.gain.value = 0.5;
        pacerSwellGain.connect(reverbNode);
        reverbNode.connect(reverbSend);
        reverbSend.connect(pacerVolGain);
    }
    // Android Chrome suspends the context on screen-lock; always attempt resume
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}

pacerVolSlider.addEventListener('input', e => { if (pacerVolGain) pacerVolGain.gain.setTargetAtTime(e.target.value, audioCtx.currentTime, 0.1); });

/* Soft swell envelope with monotonic, clamped timings — safe even for
   very short phases. */
function applySwell(gainParam, t0, tEnd, peak, attack) {
    const atk = Math.min(attack, (tEnd - t0) * 0.5);
    gainParam.setValueAtTime(0.0001, t0);
    gainParam.exponentialRampToValueAtTime(peak, t0 + atk);
    gainParam.setValueAtTime(peak, Math.max(t0 + atk, tEnd - atk));
    gainParam.exponentialRampToValueAtTime(0.0001, tEnd);
}

/* Very slow pitch shimmer (±cents) attached to a set of oscillators */
function attachVibrato(oscs, when, stopAt, cents = 2.5) {
    const lfo = audioCtx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.13 + Math.random() * 0.1;
    const depth = audioCtx.createGain();
    depth.gain.value = cents;
    lfo.connect(depth);
    oscs.forEach(o => depth.connect(o.detune));
    lfo.start(when);
    lfo.stop(stopAt);
}

function triggerAudio(phaseType, duration, baseFreq) {
    if (soundSelect.value === 'mute' || !audioCtx || !pacerSwellGain) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    const gap = 0.15;
    const end = now + duration - gap;

    const freqs = phaseType === 'inhale'
        ? [174.61, 261.63, 349.23, 440.00]
        : phaseType === 'exhale'
        ? [130.81, 196.00, 261.63, 329.63]
        : [196.00, 293.66, 392.00, 493.88];
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 1800; filter.Q.value = 0.3;
    filter.connect(pacerSwellGain);
    // Notes bloom one after another, like fingers settling on strings
    freqs.forEach((f, i) => {
        const t0 = now + i * 0.22;
        if (t0 >= end - 0.3) return;
        const g = audioCtx.createGain();
        const peak = (0.55 / freqs.length) * (1 - i * 0.08);
        applySwell(g.gain, t0, end, peak, 1.2);
        g.connect(filter);
        const oscs = makeVoice(f, g, t0, end, 'sine', 3);
        attachVibrato(oscs, t0, end, 1.8);
    });
}

function playCompletionTone() {
    initAudio();
    const now = audioCtx.currentTime;
    const freqs = [261.63, 329.63, 392.00, 523.25];
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.12, now + 0.6);
    gain.gain.setValueAtTime(0.12, now + 2.5);
    gain.gain.linearRampToValueAtTime(0, now + 4);
    gain.connect(audioCtx.destination);
    freqs.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine'; osc.frequency.value = f;
        osc.connect(gain);
        osc.start(now + i * 0.08);
        osc.stop(now + 4);
    });
}

/* ═══════════════════════════════════════════════════════════════
   UTILITY
═══════════════════════════════════════════════════════════════ */
function easeInOut(t) { return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t; }

function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2,'0')}`;
}


/* ═══════════════════════════════════════════════════════════════
   ANIMATION LOOP
═══════════════════════════════════════════════════════════════ */
function loop(timestamp) {
    if (!sessionState.lastFrameTime) sessionState.lastFrameTime = timestamp;
    const dt = Math.min((timestamp - sessionState.lastFrameTime) / 1000, 0.1); // cap at 100ms
    sessionState.lastFrameTime = timestamp;

    if (sessionState.isRunning) {
        sessionState.totalTimeRemaining -= dt;

        /* ── Session end ── */
        if (sessionState.totalTimeRemaining <= 0) {
            sessionState.totalTimeRemaining = 0;
            sessionState.isRunning = false;
            cancelAnimationFrame(sessionState.animationFrameId);
            releaseWakeLock();
            stopKeepAlive();
            updateMediaSession('none');
            triggerAudio('inhale', 3, 523.25);
            setCircleScale(1);
            arcProgress.style.strokeDashoffset = ARC_CIRCUMFERENCE;
            instructionEl.textContent  = '';
            phaseCountdown.textContent = '';
            showCompleteOverlay();
            return;
        }

        /* ── Timer ── */
        timerDisplay.textContent = formatTime(sessionState.totalTimeRemaining);

        /* ── Pattern progress ── */
        sessionState.patternTime += dt;
        const phases       = sessionState.currentPattern;
        const cycleDuration = phases.reduce((s, p) => s + p.duration, 0);
        const t            = sessionState.patternTime % cycleDuration;

        let accumulated     = 0;
        let currentPhaseIdx = 0;
        for (let i = 0; i < phases.length; i++) {
            if (t >= accumulated && t < accumulated + phases[i].duration) {
                currentPhaseIdx = i; break;
            }
            accumulated += phases[i].duration;
        }

        /* ── Phase transition ── */
        if (currentPhaseIdx !== sessionState.lastPhaseIndex) {
            const phase = phases[currentPhaseIdx];

            // Count breath completions (each full inhale = one breath)
            if (phase.type === 'inhale' && sessionState.lastPhaseIndex !== -1) {
                sessionState.breathCount++;
            }

            triggerAudio(phase.type, phase.duration, phase.freq);
            instructionEl.textContent = phase.text;
            setPhaseColor(phase.type);

            // Hold-phase pulsing glow
            if (phase.type === 'hold') {
                circle.classList.add('hold-pulse');
            } else {
                circle.classList.remove('hold-pulse');
            }

            sessionState.lastPhaseIndex = currentPhaseIdx;
            sessionState.phaseStartTime = t;
        }

        /* ── Per-frame visuals ── */
        const phase     = phases[currentPhaseIdx];
        const phaseTime = t - accumulated;
        const progress  = phaseTime / phase.duration;
        const eased     = easeInOut(progress);

        // Circle scale
        let scale = CIRCLE_MIN_SCALE;
        if (phase.type === 'inhale') {
            scale = CIRCLE_MIN_SCALE + (CIRCLE_MAX_SCALE - CIRCLE_MIN_SCALE) * eased;
        } else if (phase.type === 'exhale') {
            scale = CIRCLE_MAX_SCALE - (CIRCLE_MAX_SCALE - CIRCLE_MIN_SCALE) * eased;
        } else {
            scale = phase.holdScale !== undefined ? phase.holdScale : CIRCLE_MIN_SCALE;
        }
        setCircleScale(scale);

        // Arc ring — depletes over the phase duration
        const arcFraction = 1 - progress; // 1 = full, 0 = empty
        arcProgress.style.strokeDashoffset = ARC_CIRCUMFERENCE * (1 - arcFraction);

        // Phase countdown (ceiling so "5" shows for full second)
        const secsLeft = Math.ceil(phase.duration * (1 - progress));
        phaseCountdown.textContent = secsLeft > 0 ? secsLeft : '';

        // Volume swell
        if (pacerSwellGain) {
            let swell = 1.0;
            if (phase.type === 'inhale') swell = 0.15 + 0.85 * progress;
            else if (phase.type === 'exhale') swell = 1.0 - 0.85 * progress;
            else swell = phase.holdScale === CIRCLE_HOLD_IN_SCALE ? 1.0 : 0.15;
            pacerSwellGain.gain.setTargetAtTime(swell, audioCtx.currentTime, 0.05);
        }
    }

    sessionState.animationFrameId = requestAnimationFrame(loop);
}

function setCircleScale(s) {
    document.documentElement.style.setProperty('--circle-scale', s);
    circle.style.transform = `scale(${s})`;
}

        const breaths     = sessionState.breathCount;

            `~${breaths} breath cycles completed`;

        completeQuoteText.textContent   = `“${q.t}”`;
        completeQuoteAuthor.textContent = q.a;

        completeOverlay.classList.add('visible');
        requestAnimationFrame(() => {
            requestAnimationFrame(() => completeOverlay.classList.add('shown'));

function setUiState(state) {
    // state: 'idle' | 'running' | 'paused'
    if (state === 'running') {
        startBtn.disabled  = true;
        pauseBtn.disabled  = false;
        patternSelect.disabled = true;
        soundSelect.disabled   = true;
        minutesInput.disabled  = true;
    } else {
        startBtn.disabled  = false;
        pauseBtn.disabled  = true;
        patternSelect.disabled = false;
        soundSelect.disabled   = false;
        minutesInput.disabled  = false;
    }
}

/* ═══════════════════════════════════════════════════════════════
   SESSION CONTROLS
═══════════════════════════════════════════════════════════════ */
function startSession() {
    if (sessionState.isRunning) return;

    initAudio();
    requestWakeLock();
    setupMediaSession();
    startKeepAlive();

    sessionState.isRunning = true;
    sessionState.lastFrameTime = 0;
    setUiState('running');

    // Collapse settings, show session top row
    closeSettings();
    document.body.classList.add('session-active');
    updateQuickPauseBtn();

    // Unlock audio context (iOS)
    const unlock = audioCtx.createOscillator();
    const ug = audioCtx.createGain(); ug.gain.value = 0;
    unlock.connect(ug); ug.connect(pacerSwellGain);
    unlock.start(); unlock.stop(audioCtx.currentTime + 0.1);

    if (sessionState.patternTime === 0) {
        sessionState.startingMinutes  = parseInt(minutesInput.value) || 16;
        sessionState.totalTimeRemaining = sessionState.startingMinutes * 60;
    }

    pacerSwellGain.gain.setTargetAtTime(1, audioCtx.currentTime, 0.05);
    updateMediaSession('playing');
    sessionState.animationFrameId = requestAnimationFrame(loop);
}

function pauseSession() {
    sessionState.isRunning = false;
    cancelAnimationFrame(sessionState.animationFrameId);
    releaseWakeLock();
    setUiState('paused');
    instructionEl.textContent  = 'Paused';
    phaseCountdown.textContent = '';
    if (pacerSwellGain) pacerSwellGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
    updateMediaSession('paused');
    updateQuickPauseBtn();
    // Keep keepAlive running so audio context stays warm for resume
}

function resetSession() {
    sessionState.isRunning          = false;
    sessionState.patternTime        = 0;
    sessionState.lastFrameTime      = 0;
    sessionState.lastPhaseIndex     = -1;
    sessionState.breathCount        = 0;
    sessionState.startingMinutes    = parseInt(minutesInput.value) || 16;
    sessionState.totalTimeRemaining = sessionState.startingMinutes * 60;

    cancelAnimationFrame(sessionState.animationFrameId);
    releaseWakeLock();
    stopKeepAlive();
    updateMediaSession('none');
    setUiState('idle');

    document.body.classList.remove('session-active');
    openSettings();

    setCircleScale(1);
    circle.classList.remove('hold-pulse');
    arcProgress.style.strokeDashoffset = ARC_CIRCUMFERENCE;

    timerDisplay.textContent   = formatTime(sessionState.totalTimeRemaining);
    instructionEl.textContent  = 'Ready to breathe';
    phaseCountdown.textContent = '';
    setPhaseColor('exhale'); // neutral teal at rest

    if (pacerSwellGain) pacerSwellGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
    showIdleQuote();
}

startBtn.addEventListener('click', () => { startSession(); updateQuickPauseBtn(); });
pauseBtn.addEventListener('click', () => { pauseSession(); updateQuickPauseBtn(); });
resetBtn.addEventListener('click', resetSession);

/* ═══════════════════════════════════════════════════════════════
   PATTERN SELECTION
═══════════════════════════════════════════════════════════════ */
patternSelect.addEventListener('change', e => {
    updatePatternDescription(e.target.value);
    sessionState.currentPattern    = PATTERNS[e.target.value].phases;
    sessionState.currentPatternKey = e.target.value;
    resetSession();
});

minutesInput.addEventListener('change', e => {
    let val = parseInt(e.target.value);
    if (val < 1)  val = 1;
    if (val > 60) val = 60;
    e.target.value = val;
    sessionState.startingMinutes    = val;
    sessionState.totalTimeRemaining = val * 60;
    timerDisplay.textContent = formatTime(sessionState.totalTimeRemaining);
});

/* ═══════════════════════════════════════════════════════════════
   PAGE LIFECYCLE — audio resume + wake lock on Android
═══════════════════════════════════════════════════════════════ */

function restoreAudioAndLock() {
    // Resume the AudioContext — Android Chrome suspends it on screen-lock
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    if (sessionState.isRunning) {
        // Wake lock is released automatically when the page hides; re-request it
        requestWakeLock();
        updateMediaSession('playing');
    }
}

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        restoreAudioAndLock();
    }
});

// pageshow fires on bfcache restore — another path where Android Chrome
// can leave the AudioContext suspended
window.addEventListener('pageshow', (e) => {
    if (e.persisted) restoreAudioAndLock();
});

/* ═══════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════ */
timerDisplay.textContent = formatTime(sessionState.totalTimeRemaining);
setPhaseColor('exhale');
showIdleQuote();
</script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(() => console.log('SW registered'));
    }
</script>
